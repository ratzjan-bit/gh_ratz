<style>
/* Layout: mobile-first app shell — sticky green header, scrolling content, fixed bottom tab bar. */
/* Farben & Schriften nach ratz.at: Creme/Papier, Wirtshausgrün, Gold, Playfair Display + Source Sans 3 */
:root{
  --bg:#f7f3ea; --surface:#fcf9f2; --surface-2:#eee7d6; --ink:#3a3a30; --muted:#6f6a5c; --line:#ddd3bf;
  --accent:#3f4a39; --accent-ink:#fcf9f2; --accent-soft:#e3e7d8;
  --head-bg:#f6efe2; --head-ink:#38432f; --head-sub:#8a9a78;
  --brass:#b07a2e; --brass-soft:#f3e6cf; --gold:#c98a3c;
  --warn:#9c5f12; --warn-soft:#f6e6cb; --danger:#a63d2a; --danger-soft:#f6dfd7; --ok:#54603f; --ok-soft:#e3ead3;
  --hatch:#e8e0cd; --shadow:0 1px 2px rgba(50,34,20,.05),0 6px 18px rgba(50,34,20,.07); --crest:none;
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-body:'Source Sans 3','Helvetica Neue',Arial,system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f19; --surface:#242a21; --surface-2:#2d3429; --ink:#ece6d8; --muted:#aaa491; --line:#3b4435;
    --accent:#a7b795; --accent-ink:#1b1f19; --accent-soft:#33402e; --head-bg:#242a21; --head-ink:#ece6d8; --head-sub:#a7b795;
    --brass:#d9a55a; --brass-soft:#3b3020; --gold:#d9a55a; --warn:#e2a956; --warn-soft:#3b2e18; --danger:#ec8a76; --danger-soft:#3e2420;
    --ok:#a7b795; --ok-soft:#2b3626; --hatch:#2a3027; --shadow:0 1px 2px rgba(0,0,0,.3); --crest:invert(.92); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f19; --surface:#242a21; --surface-2:#2d3429; --ink:#ece6d8; --muted:#aaa491; --line:#3b4435;
  --accent:#a7b795; --accent-ink:#1b1f19; --accent-soft:#33402e; --head-bg:#242a21; --head-ink:#ece6d8; --head-sub:#a7b795;
  --brass:#d9a55a; --brass-soft:#3b3020; --gold:#d9a55a; --warn:#e2a956; --warn-soft:#3b2e18; --danger:#ec8a76; --danger-soft:#3e2420;
  --ok:#a7b795; --ok-soft:#2b3626; --hatch:#2a3027; --shadow:0 1px 2px rgba(0,0,0,.3); --crest:invert(.92); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:28px}
h2{font-size:19px}
h3{font-size:15px;font-family:var(--font-body);font-weight:600;margin:14px 0 6px}
small{font-size:12px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.app-head{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-ink);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--head-ink);line-height:1}
.brand img{height:42px;width:auto;display:block;filter:var(--crest)}
.brand .bt{display:flex;flex-direction:column}
.brand .bt small{font-family:var(--font-body);font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--head-sub);font-weight:600}
.brand .bt b{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.02em}
.brand .bt i{font-style:normal;font-family:var(--font-body);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.head-btn{background:var(--surface);border:1px solid var(--line);color:inherit;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
.head-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.head-btn.due .dot{background:var(--gold)}

main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:10px;min-width:0}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--gold)}
@media (min-width:900px){ nav.tabs{max-width:720px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0} }

/* Generic */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card > h2{margin-bottom:10px}
[id^="sec-"]{scroll-margin-top:84px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h2{margin:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:transparent}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:8px 11px;font-size:18px;line-height:1}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,#888);flex:none}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--danger-soft);color:var(--danger)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--brass-soft);color:var(--brass)}
.notice{border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:14px;margin:8px 0}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,input.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;min-height:42px;font-size:16px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.fstack{display:flex;flex-direction:column;gap:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* Lists */
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow.who .grow{min-width:170px}
.lrow .grow b{display:block;overflow:hidden;text-overflow:ellipsis}
.lrow .grow small{color:var(--muted);display:block}
button.lrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;padding:9px 2px;flex-wrap:nowrap}
button.lrow:hover{background:var(--surface-2)}
.duty-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}

/* Week nav */
.weeknav{display:flex;align-items:center;gap:6px}
.weekpick{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;text-align:center;cursor:pointer;min-width:150px}
.weekpick b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.1}
.weekpick small{color:var(--muted)}
.weekpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}

/* Übersicht: Tage & Dienste */
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dayhead b{font-family:var(--font-display);font-size:18px;font-weight:600}
.dayhead small{display:block;color:var(--muted)}
.day.is-today .dayhead{box-shadow:inset 4px 0 0 var(--accent)}
.day.is-past{opacity:.62}
.day.is-closed .dayhead{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,var(--surface-2) 6px 12px);border-bottom:0}
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.svc{padding:12px 14px 14px;border-top:1px solid var(--line);min-width:0}
.svcs .svc:first-child{border-top:0}
@media (min-width:720px){ .svcs .svc{border-top:0} .svcs .svc + .svc{border-left:1px solid var(--line)} }
.svc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.svc-head h3{margin:0;font-family:var(--font-display);font-size:17px}
.svc-head small{color:var(--muted)}
.svc-body{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:start}
.guests{display:flex;flex-direction:column;align-items:flex-start;min-width:92px}
.guests .big{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.guests .lbl2{font-size:12px;color:var(--muted);font-weight:600}
.guests .split{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.guests input{width:58px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface);font-size:15px;text-align:right}
.svc-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.sublbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.room{border:1px solid var(--line);border-radius:9px;padding:5px 9px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left;color:var(--ink)}
.room b{font-size:13px;display:flex;align-items:center;gap:5px}
.room b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5}
.room small{color:var(--muted);font-variant-numeric:tabular-nums}
.room.on{border-color:var(--ok);background:var(--ok-soft)}
.room.on b::before{background:var(--ok);opacity:1}
.room.alert{border-color:var(--warn);background:var(--warn-soft)}
.room.alert small{color:var(--warn);font-weight:600}
.room.full small{color:var(--danger);font-weight:700}
.staffline{display:flex;flex-wrap:wrap;gap:6px 14px}
.sl{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-variant-numeric:tabular-nums}
.sl b{font-size:15px}
button.sl{background:none;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin:-2px -6px;cursor:pointer;color:var(--ink)}
button.sl:hover{border-color:var(--line)}
.sl.off{color:var(--muted);border-style:dashed;border-color:var(--line)}
.sl.off .dot{opacity:.4}
.sl.off i{font-style:normal;font-size:12.5px}
.sl.short b{color:var(--danger)}
.names{font-size:12.5px;color:var(--muted);margin-top:3px}
.reslist{margin-top:10px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.reslist button{all:unset;box-sizing:border-box;display:flex;gap:8px;width:100%;padding:3px 0;cursor:pointer}
.reslist button:hover{color:var(--accent)}
.reslist .t{width:42px;font-weight:700;font-variant-numeric:tabular-nums}
.reslist .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reslist .r{color:var(--muted)}
@media (max-width:380px){ .svc-body{grid-template-columns:1fr} }

/* Dienstplan */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;font-size:12.5px}
.plan th,.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0;text-align:left}
.plan tr > :last-child{border-right:0}
.plan thead th{background:var(--surface-2);padding:7px 6px;font-weight:600}
.plan thead th b{display:block;font-size:13px}
.plan thead th small{display:block;color:var(--muted);font-weight:500;font-size:11px;line-height:1.3}
.plan thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.plan thead th.closed{color:var(--muted)}
.plan .namecol{position:sticky;left:0;z-index:2;background:var(--surface);width:124px;min-width:124px;max-width:150px;padding:7px 8px;border-right:1px solid var(--line)}
.plan thead .namecol{z-index:3;background:var(--surface-2)}
.plan .namecol b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .namecol small{color:var(--muted);display:flex;align-items:center;gap:4px}
.plan td.cell{min-width:96px}
.plan td.closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.plan td.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.plan tr.grp th{background:var(--surface-2);padding:4px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cellbtn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;min-height:50px;padding:5px;cursor:pointer}
.cellbtn:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cellbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cellbtn .plus{color:var(--line);font-size:20px;line-height:1;margin:auto;font-weight:300}
.chip{display:block;border-left:3px solid var(--c,#888);background:var(--surface-2);background:color-mix(in srgb,var(--c,#888) 15%,var(--surface));border-radius:4px;padding:2px 5px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.chip.inline{display:inline-block}
.abs{display:block;border-radius:4px;padding:2px 5px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.abs[data-t="Urlaub"]{background:var(--brass-soft);color:var(--brass)}
.abs[data-t="Krank"]{background:var(--danger-soft);color:var(--danger)}
.resline{display:block;color:var(--brass);font-weight:600;font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.daybody{padding:6px 14px 10px}
.dgroup{padding:6px 0}
.dgroup + .dgroup{border-top:1px dashed var(--line)}
.drow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:5px 0;cursor:pointer;flex-wrap:wrap}
.drow .nm{min-width:120px;flex:1;font-weight:600}
.absline{font-size:13px;color:var(--muted);padding-top:6px}

/* Reservierungen */
.res-item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res-item:last-child{border-bottom:0}
.res-item:hover{background:var(--surface-2)}
.res-time{font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.res-main{min-width:0}
.res-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-main small{display:block;color:var(--muted)}
.res-pax{text-align:right;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.1}
.res-pax small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:500}
.search{flex:1;min-width:160px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted)}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.tagchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.tagchips button:hover{border-color:var(--accent)}
.res-main .kom{color:var(--brass);font-weight:600}

/* Betrieb */
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.season{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.season-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.season-head .inp{flex:1;min-width:140px;width:auto;font-weight:600}
.mini.season{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted);border:0;padding:0;background:none}
.mini.season select{border:1px solid var(--line);border-radius:7px;padding:5px 4px;background:var(--surface);min-height:36px;font-size:15px;max-width:9.5em}
.wkwrap{overflow-x:auto;margin-top:6px}
table.wk{border-collapse:collapse;font-size:12.5px;width:100%;max-width:420px}
table.wk th{font-weight:600;color:var(--muted);padding:2px 1px;text-align:center}
table.wk tbody th{text-align:left;padding-right:4px;color:var(--ink);width:1%}
table.wk td{text-align:center;padding:3px 1px}
table.wk input{width:19px;height:19px;margin:0;accent-color:var(--accent)}
.hrow{display:grid;grid-template-columns:110px auto auto 1fr;gap:8px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hday{font-weight:700}
.hslots{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.hslots span,.hslots label{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.hslots input,.erow input.t{border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface);min-height:36px;font-size:15px;width:auto}
.hrow.is-zu .hslots{opacity:.4}

.erow{display:flex;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.erow:last-of-type{border-bottom:0}
.erow input[type="color"]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.erow input.inp{flex:1;min-width:120px;width:auto}
.erow .mini{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.erow .mini input{width:58px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface);min-height:36px;font-size:15px;text-align:right}
.erow .mini select{border:1px solid var(--line);border-radius:7px;padding:5px 4px;background:var(--surface);min-height:36px;font-size:15px;max-width:9.5em}
.erow .mini.season{flex-wrap:wrap;max-width:100%}
.snap{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.snap:last-child{border-bottom:0}
.snap .grow{flex:1;min-width:180px}

/* Reports */
.repactions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.paper{background:#fff;color:#16181a;border-radius:8px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}

/* Modal */
#modal-root,#ask-root{position:fixed;inset:0;z-index:100}
#ask-root{z-index:110}
.mback{position:absolute;inset:0;background:rgba(10,18,13,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:600px;max-height:100%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
.modal.small{max-width:440px}
@media (min-width:700px){ .mback{align-items:center;padding:24px} .modal{border-radius:18px;max-height:calc(100% - 48px)} }
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){ .modal{animation:none} }
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mhead h2{flex:1;font-size:20px}
.xbtn{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.mbody{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.mfoot .left{margin-right:auto}
.meta-line{color:var(--muted);font-size:14px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tplbtn{text-align:left;border:1px solid var(--line);border-left:4px solid var(--c,#888);background:var(--surface);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.tplbtn:hover{background:var(--surface-2)}
.tplbtn small{color:var(--muted);font-variant-numeric:tabular-nums}
textarea.code{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);color:var(--ink)}

/* Toast */
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.err{background:var(--danger);color:#fff}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* Willkommen */
.welcome{max-width:560px;margin:30px auto}
.welcome .crest{height:96px;width:auto;display:block;margin-bottom:14px;filter:var(--crest)}
.welcome h1{font-size:30px}
.welcome p{color:var(--muted)}

#print-root{display:none}
@media print{
  body{background:#fff!important}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .paper{box-shadow:none;border:0;padding:0;border-radius:0}
}

<script>
'use strict';
/* ==========================================================================
   Gasthof Ratz – Planungshilfe für den Chef-Kellner
   Übersicht (Gäste/Räume/Personal je Mittag & Abend), Dienstplan, Personal,
   Reservierungen, offene Tage (Mittag/Abend), Reports. Daten lokal im Browser + Backups.
   ========================================================================== */
const APP_ID='gasthof-ratz-planer', VERSION=2;
const KEY='gasthofRatz.data.v1', SNAP_KEY='gasthofRatz.snapshots.v1', UI_KEY='gasthofRatz.ui.v2';
const MAX_SNAPS=8;
const ART=!!window.ARTIFACT_MODE;   // Testversion als Claude-Artifact: kein Drucken/Download/Teilen möglich

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d);};
const wd=s=>(P(s).getDay()+6)%7;           // Mo=0 … So=6
const monday=s=>addD(s,-wd(s));
const today=()=>iso(new Date());
const dayDiff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const days=(a,b)=>{const r=[];let d=a,g=0;while(d<=b&&g<800){r.push(d);d=addD(d,1);g++;}return r;};
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const fmtShort=d=>{const x=P(d);return `${pad(x.getDate())}.${pad(x.getMonth()+1)}.`;};
const fmtDate=d=>{const x=P(d);return `${pad(x.getDate())}.${pad(x.getMonth()+1)}.${x.getFullYear()}`;};
const fmtDay=d=>`${WD[wd(d)]} ${fmtShort(d)}`;
const fmtLong=d=>P(d).toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTS=ts=>new Date(ts).toLocaleString('de-AT',{dateStyle:'medium',timeStyle:'short'});
const rangeTxt=(a,b)=>a===b?fmtDate(a):`${fmtShort(a)} – ${fmtDate(b)}`;
const tmin=t=>{if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+(m||0);};
const hhmm=m=>{m=((m%1440)+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`;};
const span=(a,b)=>{const s=tmin(a);let e=tmin(b);if(e<=s)e+=1440;return [s,e];};
const col=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#888888';
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`;

function migrate(d){
  const def=defaults();
  const o=Object.assign({},def,d);
  o.betrieb=Object.assign({},def.betrieb,d.betrieb||{});
  o.meta=Object.assign({},def.meta,d.meta||{});
  for(const k of ['staff','absences','shifts','reservations','templates','abteilungen','raeume']) if(!Array.isArray(o[k])) o[k]=def[k];
  for(const k of ['raumStatus','erwartet','abtAus']) if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k])) o[k]={};
  // Öffnung nur noch als Mittag/Abend (ältere Daten mit Uhrzeiten werden umgerechnet)
  const sp=tmin(o.betrieb.abendAb||'16:00');
  const toMA=(zu,slots)=>{if(zu)return {m:false,a:false};const sl=(slots||[]).filter(x=>x.von&&x.bis);if(!sl.length)return {m:true,a:true};return {m:sl.some(x=>span(x.von,x.bis)[0]<sp),a:sl.some(x=>span(x.von,x.bis)[1]>sp)};};
  o.hours=(d.hours&&Array.isArray(d.hours.weekly)&&d.hours.weekly.length===7)?{
    weekly:d.hours.weekly.map(w=>('m' in w)?{m:!!w.m,a:!!w.a}:toMA(w.zu,w.slots)),
    seasons:(Array.isArray(d.hours.seasons)?d.hours.seasons:[]).filter(z=>Array.isArray(z.weekly)&&z.weekly.length===7).map(z=>({id:z.id||uid(),name:z.name||'Saison',von:z.von||'',bis:z.bis||'',weekly:z.weekly.map(w=>({m:!!w.m,a:!!w.a}))})),
    special:(Array.isArray(d.hours.special)?d.hours.special:[]).map(x=>('m' in x)?x:{id:x.id||uid(),name:x.name||'',von:x.von,bis:x.bis||x.von,...toMA(x.typ==='zu',x.slots)})}:def.hours;
  // Abteilungen: Bedarfswerte ergänzen
  o.abteilungen.forEach(a=>{if(a.jeGaeste===undefined){const x=def.abteilungen.find(z=>z.id===a.id);a.jeGaeste=x?x.jeGaeste:0;a.min=x?x.min:0;}});
  // Räume: IDs & Standard
  o.raeume.forEach((r,i)=>{if(!r.id)r.id=uid();if(r.standard===undefined)r.standard=i===0;r.plaetze=+r.plaetze||0;
    if(r.saisonVon===undefined){ if(r.id==='garten'){r.saisonVon='06-01';r.saisonBis='09-30';r.standard=true;} else {r.saisonVon='';r.saisonBis='';} }});
  // Personal: nur noch Fix / Springer
  o.staff.forEach(s=>{if(!s.typ)s.typ=['Minijob','Aushilfe','Saisonkraft'].includes(s.vertrag)?'springer':'fix';if(s.aktiv===undefined)s.aktiv=true;});
  // Reservierungen: Raum per ID
  o.reservations.forEach(r=>{if(!r.raum&&r.bereich){const x=o.raeume.find(z=>z.name===r.bereich);r.raum=x?x.id:'';}});
  o.reservations=o.reservations.filter(r=>r.status!=='storniert');
  o.absences.forEach(a=>{if(!ABS_TYPES.includes(a.typ))a.typ='Frei';});
  o.app=APP_ID;o.version=VERSION;
  return o;
}

    while(sn.length>1){sn.pop();try{localStorage.setItem(SNAP_KEY,JSON.stringify(sn));localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(_){}}

  }
}

function commit(label,fn,opts={}){
  const before=JSON.stringify(S);
  if(fn()===false) return false;
  undoStack.push(before); if(undoStack.length>25) undoStack.shift();
  save(); render();
  if(label) toast(label,{undo:opts.undo!==false});
  return true;
}
function undo(){
  const prev=undoStack.pop(); if(!prev){toast('Nichts zum Rückgängigmachen');return;}

function openInfo(d){
  const sp=S.hours.special.find(x=>d>=x.von&&d<=(x.bis||x.von));
  if(sp) return {sid:sp.id,closed:!sp.m&&!sp.a,m:!!sp.m,a:!!sp.a,note:sp.name||((!sp.m&&!sp.a)?'Geschlossen':'Sondertag')};

  }
  return {closed:!w.m&&!w.a,m:!!w.m,a:!!w.a,note:(!w.m&&!w.a)?'Ruhetag':note,saison:W.name};
}
const slotsTxt=o=>o.closed?(o.note||'geschlossen'):(o.m&&o.a?'Mittag & Abend':o.m?'nur Mittag':'nur Abend');

const svcOfTime=t=>tmin(t)<split()?'M':'A';
function shiftIn(x,k){const [s,e]=span(x.von,x.bis),sp=split();return k==='M'?s<sp:e>sp;}
/* Welche Dienste (Mittag/Abend) gibt es an diesem Tag? */
function servicesOf(d){const o=openInfo(d);return [o.m&&{k:'M',zeit:''},o.a&&{k:'A',zeit:''}].filter(Boolean);}
const timeInOpen=(o,t)=>!o.closed&&(svcOfTime(t)==='M'?o.m:o.a);
/* Saison: MM-DD von/bis, gilt jedes Jahr; auch über den Jahreswechsel (z. B. 11-01 bis 02-28) */
const mdIn=(md,a,b)=>a<=b?(md>=a&&md<=b):(md>=a||md<=b);
function inSeason(d,r){ if(!r.saisonVon||!r.saisonBis) return true; return mdIn(d.slice(5),r.saisonVon,r.saisonBis); }
const doy=md=>{const [m,d]=md.split('-').map(Number);return [0,31,60,91,121,152,182,213,244,274,305,335][m-1]+d;};
const mdLen=(a,b)=>{const x=doy(b)-doy(a);return x>=0?x:x+366;};
/* Wochenplan für ein Datum: passende Saison (bei Überschneidung die kürzere), sonst Standard */
function weeklyFor(d){
  const md=d.slice(5); let best=null;
  for(const z of (S.hours.seasons||[])){ if(z.von&&z.bis&&mdIn(md,z.von,z.bis)&&(!best||mdLen(z.von,z.bis)<mdLen(best.von,best.bis))) best=z; }
  return best?{w:best.weekly,name:best.name}:{w:S.hours.weekly,name:''};
}
const roomDefault=(d,r)=>inSeason(d,r)&&!!r.standard;
function roomOpen(d,k,r){const st=S.raumStatus[d+'|'+k];return st&&st[r.id]!==undefined?st[r.id]:roomDefault(d,r);}
const MONATE=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const mdTxt=md=>{const [m,d]=md.split('-').map(Number);return `${d}. ${MONATE[m-1]}`;};

function wkGrid(key,weekly){

}
/* Tag + Monat ohne Jahr (Saison wiederholt sich jährlich) */
function mdPick(name,md,lbl){

  return `<select name="${name}_d" aria-label="Saison ${lbl} Tag">${opt('','–',d||'')}${Array.from({length:31},(_,i)=>opt(i+1,(i+1)+'.',d||'')).join('')}</select><select name="${name}_m" aria-label="Saison ${lbl} Monat">${opt('','– ganzjährig –',m||'')}${MONATE.map((n,i)=>opt(i+1,n,m||'')).join('')}</select>`;
}
function mdRead(v,name){
  const m=+v[name+'_m'], d=+v[name+'_d']||1; if(!m) return '';
  const max=[31,29,31,30,31,30,31,31,30,31,30,31][m-1];
  return `${pad(m)}-${pad(Math.min(d,max))}`;
}
const seasonTxt=r=>r.saisonVon&&r.saisonBis?`${mdTxt(r.saisonVon)} – ${mdTxt(r.saisonBis)}`:'ganzjährig';
/* Personalbedarf – fest hinterlegte Faustregeln, bewusst nicht in den Einstellungen.
   Eine Person schafft über den ganzen Dienst "gesamt" Gäste, aber nur "spitze" Gäste,
   die innerhalb von FENSTER Minuten ankommen. Beispiel Service: 25 Gäste im Halbstundentakt → 1,
   25 Gäste gleichzeitig → 2. Laufkundschaft (geschätzt) verteilt sich, ein Viertel zählt zur Spitze. */
const BEDARF={service:{gesamt:40,spitze:15},kueche:{gesamt:50,spitze:25}};
const FENSTER=30;
function peakOf(res,erwartet){
  let best={p:0,von:''};
  res.forEach(r=>{const t=tmin(r.zeit);const p=sum(res.filter(x=>{const m=tmin(x.zeit);return m>=t&&m<t+FENSTER;}),x=>x.personen);if(p>best.p)best={p,von:r.zeit};});
  return {p:best.p+Math.round(erwartet/4),res:best.p,von:best.von,bis:best.von?hhmm(tmin(best.von)+FENSTER):''};
}
function bedarf(a,g,pk){
  const r=BEDARF[a.id]; if(!r||g<=0) return null;
  const nG=Math.ceil(g/r.gesamt), nS=Math.ceil(pk.p/r.spitze);
  return {n:Math.max(1,nG,nS),spitze:nS>nG&&nS>1};
}

/* Kernfrage: Gäste, Räume, Personal für einen Dienst */
function svcInfo(d,k){
  const res=S.reservations.filter(r=>r.datum===d&&svcOfTime(r.zeit)===k).sort(byTime);
  const reserviert=sum(res,r=>r.personen), erwartet=+S.erwartet[d+'|'+k]||0, gaeste=reserviert+erwartet;
  const rooms=S.raeume.map(r=>{const rr=res.filter(x=>x.raum===r.id);return {r,open:roomOpen(d,k,r),pers:sum(rr,x=>x.personen),saison:inSeason(d,r)};});
  const ohneRaum=sum(res.filter(x=>!raumById(x.raum)),x=>x.personen);
  const plaetze=sum(rooms.filter(z=>z.open),z=>z.r.plaetze);
  const shifts=S.shifts.filter(x=>x.datum===d&&shiftIn(x,k));
  const peak=peakOf(res,erwartet);
  const depts=S.abteilungen.map(a=>{
    const sh=shifts.filter(x=>x.abt===a.id).sort(byTime);
    const ids=[...new Set(sh.map(x=>x.staff))];
    const off=!!(S.abtAus[d+'|'+k]||{})[a.id];
    // Bedarf nur, wenn Gäste kommen und die Abteilung in diesem Dienst gebraucht wird
    const b=off?null:bedarf(a,gaeste,peak);
    return {a,n:ids.length,off,need:b?b.n:null,spitze:!!(b&&b.spitze),list:sh.map(x=>({s:staffById(x.staff),x})).filter(z=>z.s)};
  });
  const fehlt=depts.filter(z=>z.need!==null&&z.need>z.n);
  const raumAlarm=rooms.filter(z=>!z.open&&z.pers>0);
  const voll=rooms.filter(z=>z.open&&z.r.plaetze&&z.pers>z.r.plaetze);
  return {d,k,peak,res,reserviert,erwartet,gaeste,rooms,ohneRaum,plaetze,depts,fehlt,raumAlarm,voll};
}

/* Konflikte im Dienstplan (nur das Nötigste) */
function conflicts(from,to){
  const W=[];
  S.shifts.forEach(x=>{
    if(x.datum<from||x.datum>to) return;
    const s=staffById(x.staff); if(!s) return;
    const ab=absenceOn(x.staff,x.datum); if(ab) W.push({d:x.datum,s:x.staff,t:`${ab.typ} eingetragen, aber eingeteilt`});
    const o=openInfo(x.datum); if(o.closed) W.push({d:x.datum,s:x.staff,t:`eingeteilt, obwohl ${o.note||'geschlossen'}`});
  });
  return W.sort((a,b)=>a.d.localeCompare(b.d));
}

function modal(title,body,foot='',cls=''){
  const root=$('#modal-root');
  root.innerHTML=`<div class="mback" data-a="mback"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="mhead"><h2 id="mtitle">${title}</h2><button type="button" class="xbtn" data-a="mclose" aria-label="Schließen">×</button></div><div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div></div>`;
  root.hidden=false; document.body.classList.add('noscroll');
  setTimeout(()=>{const f=root.querySelector('[autofocus]'); if(f&&window.matchMedia('(min-width:700px)').matches) f.focus();},40);
}
function closeModal(){const r=$('#modal-root');r.innerHTML='';r.hidden=true;document.body.classList.remove('noscroll');}
function choice(title,msg,buttons){
  return new Promise(res=>{
    const root=$('#ask-root');
    root.innerHTML=`<div class="mback"><div class="modal small" role="alertdialog" aria-modal="true"><div class="mhead"><h2>${esc(title)}</h2></div><div class="mbody">${msg}</div><div class="mfoot">${buttons.map(b=>`<button type="button" class="btn ${b.cls||''}" data-v="${esc(b.v)}">${esc(b.l)}</button>`).join('')}</div></div></div>`;
    root.hidden=false;
    root.onclick=e=>{const b=e.target.closest('[data-v]');const back=e.target.classList.contains('mback');if(b||back){root.innerHTML='';root.hidden=true;root.onclick=null;res(b?b.dataset.v:null);}};
  });
}
const ask=(title,msg,ok='OK',danger=false)=>choice(title,msg,[{v:'no',l:'Abbrechen'},{v:'ok',l:ok,cls:danger?'danger':'primary'}]).then(v=>v==='ok');
function download(name,content,type){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('In die Zwischenablage kopiert');return true;}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){} ta.remove();
  toast(ok?'In die Zwischenablage kopiert':'Kopieren nicht möglich – bitte Text manuell markieren',{err:!ok});
  return ok;
}
function phoneIntl(p){
  let d=String(p||'').replace(/[^\d+]/g,''); if(!d) return '';
  if(d.startsWith('+')) return d.slice(1); if(d.startsWith('00')) return d.slice(2);
  if(d.startsWith('0')) return '43'+d.slice(1); return d;
}
const telHref=p=>'tel:'+String(p||'').replace(/[^\d+]/g,'');

/* ---------- Rendern ---------- */
function backupDue(){if(!S)return false;const m=S.meta;return !!m.lastChange&&m.lastChange>m.lastBackup&&(Date.now()-m.lastBackup>7*864e5);}
function updateHead(){
  const b=$('#headBackup'); if(!b||!S) return;
  b.hidden=!backupDue();
  const nm=(S.betrieb.name||'Gasthof Ratz').trim(), mm=nm.match(/^(Gasthof|Gasthaus|Landgasthof|Wirtshaus)\s+(.+)$/i);
  $('#brand .bt').innerHTML=mm?`<small>${esc(mm[1])}</small><b>${esc(mm[2])}</b>`:`<b>${esc(nm)}</b>`;
}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([id,l,ic])=>`<button data-a="tab" data-t="${id}" ${UI.tab===id?'aria-current="page"':''}>${ic}<span>${l}</span></button>`).join('');
  $('#tabs').hidden=!S; if(!S) $('#headBackup').hidden=true;
}
function render(){
  renderTabs(); updateHead();
  const v=$('#view');
  if(!S){v.innerHTML=viewWelcome();return;}
  v.innerHTML=({start:viewStart,plan:viewPlan,res:viewRes,staff:viewStaff,reports:viewReports,setup:viewSetup}[UI.tab]||viewStart)();
}
function go(tab){UI.tab=tab;saveUI();closeModal();render();window.scrollTo(0,0);}
function weekNav(){
  const from=UI.week,to=addD(from,6);
  return `<div class="weeknav">
    <button class="btn icon" data-a="week" data-n="-7" aria-label="Vorherige Woche">‹</button>
    <label class="weekpick" title="Woche wählen"><b>KW ${kw(from)}</b><small>${esc(rangeTxt(from,to))}</small><input type="date" data-ch="planweek" value="${from}" aria-label="Woche wählen"></label>
    <button class="btn icon" data-a="week" data-n="7" aria-label="Nächste Woche">›</button>
  </div>${monday(today())!==from?'<button class="btn sm" data-a="week-today">Heute</button>':''}`;
}

/* ---------- Übersicht ---------- */
function viewStart(){
  const from=UI.week,to=addD(from,6),t=today();
  const hasStaff=S.staff.some(s=>s.aktiv!==false);
  return `<div class="toolbar">${weekNav()}<span class="spacer"></span><button class="btn sm" data-a="res-new">+ Reservierung</button><button class="btn sm" data-a="rep-preset" data-type="week" data-p="custom-week">Senden</button></div>
  ${hasStaff?'':`<div class="notice">Noch kein Personal angelegt. <button class="btn sm" data-a="tab" data-t="staff">Personal anlegen</button></div>`}
  <div class="stack">${days(from,to).map(d=>dayCard(d,t)).join('')}</div>`;
}
function dayCard(d,t){
  const o=openInfo(d), hol=holiday(d), svcs=servicesOf(d);
  const closedRes=o.closed?S.reservations.filter(r=>r.datum===d):[];
  let body='';
  if(d<t){
    const info=svcs.map(s=>{const I=svcInfo(d,s.k);return `${SVC[s.k]} ${I.gaeste} Gäste`;}).join(' · ');
    return `<section class="card day is-past ${o.closed?'is-closed':''}" id="day-${d}"><header class="dayhead" style="border-bottom:0"><div style="flex:1;min-width:0"><b>${esc(WDL[wd(d)])}, ${esc(fmtShort(d))}</b><small>${esc(o.closed?(o.note||'geschlossen'):info)}</small></div></header></section>`;
  }
  if(o.closed){
    body=closedRes.length?`<div class="svc"><div class="notice err" style="margin:0">${esc(o.note||'Geschlossen')}, aber ${sum(closedRes,r=>r.personen)} Gäste reserviert!</div></div>`:'';
  } else body=`<div class="svcs">${svcs.map(s=>svcBlock(svcInfo(d,s.k),s.zeit)).join('')}</div>`;
  return `<section class="card day ${o.closed?'is-closed':''} ${d===t?'is-today':''} ${d<t?'is-past':''}" id="day-${d}">
    <header class="dayhead"><div style="flex:1;min-width:0"><b>${esc(WDL[wd(d)])}, ${esc(fmtShort(d))}</b> ${d===t?'<span class="pill ok">heute</span>':''} ${hol?`<span class="tag">${esc(hol)}</span>`:''} ${o.sid&&!o.closed?`<span class="tag">${esc(o.note)}</span>`:''}<small>${esc(o.closed?(o.note||'geschlossen'):slotsTxt(o))}${o.saison&&!o.sid?' · '+esc(o.saison):''}</small></div>
    ${o.sid?`<button class="btn sm ghost" data-a="special-edit" data-id="${o.sid}">Sondertag ändern</button>`:o.closed?`<button class="btn sm" data-a="day-open" data-d="${d}">Ausnahmsweise öffnen</button>`:''}
    ${o.closed?'':`<button class="btn sm ghost" data-a="plan-day" data-d="${d}">Dienstplan</button>`}</header>${body}</section>`;
}
function svcBlock(I,zeit){
  const key=I.d+'|'+I.k;
  const status=I.fehlt.length?`<span class="pill err">${I.fehlt.map(z=>`${esc(z.a.name)}: ${z.need-z.n} fehlt`).join(' · ')}</span>`:(I.depts.some(z=>z.need!==null)?'<span class="pill ok">Personal passt</span>':'');
  const rooms=I.rooms.filter(z=>z.saison||z.open||z.pers).map(z=>{
    const cls=z.open?'on':(z.pers?'alert':''), full=z.open&&z.r.plaetze&&z.pers>z.r.plaetze;
    const info=(z.open?(z.r.plaetze?`${z.pers} / ${z.r.plaetze}`:`${z.pers} res.`):(z.pers?`zu · ${z.pers} res.!`:'zu'))+(z.saison?'':' · außer Saison');
    return `<button class="room ${cls} ${full?'full':''}" data-a="room" data-d="${I.d}" data-k="${I.k}" data-r="${z.r.id}" aria-pressed="${z.open}" title="Tippen: auf/zu"><b>${esc(z.r.name)}</b><small>${info}</small></button>`;
  }).join('');
  const staff=I.depts.filter(z=>z.n||z.need||z.off).map(z=>`<button class="sl ${z.need!==null&&z.need>z.n?'short':''} ${z.off?'off':''}" data-a="abt-aus" data-d="${I.d}" data-k="${I.k}" data-abt="${z.a.id}" title="Tippen: ${esc(z.a.name)} in diesem Dienst ${z.off?'wieder einplanen':'nicht nötig'}"><span class="dot" style="--c:${col(z.a.farbe)}"></span>${esc(z.a.name)} ${z.off?'<i>nicht nötig</i>':`<b>${z.n}</b>${z.need!==null?`<span class="muted">/${z.need}</span>`:''}`}</button>`).join('')||'<span class="muted" style="font-size:13px">niemand eingeteilt</span>';
  const names=I.depts.filter(z=>z.list.length).map(z=>z.list.map(y=>`${esc(firstName(y.s.name))} ${y.x.von}`).join(', ')).join(' · ');
  const over=I.plaetze&&I.gaeste>I.plaetze;
  return `<div class="svc">
    <div class="svc-head"><h3>${SVC[I.k]}</h3><small>${esc(zeit)}</small><span class="spacer"></span>${status}</div>
    <div class="svc-body">
      <div class="guests"><span class="big">${I.gaeste}</span><span class="lbl2">Gäste</span>
        <span class="split">${I.reserviert} reserviert<br>+ <input type="number" min="0" max="999" inputmode="numeric" value="${I.erwartet||''}" placeholder="0" data-ch="erwartet" data-key="${key}" aria-label="Zusätzlich erwartete Gäste"> erwartet</span></div>
      <div class="svc-side">
        <div><div class="sublbl">Räume${I.plaetze?` · ${I.plaetze} Plätze offen`:''}</div><div class="rooms">${rooms}</div>${over?`<div class="hint" style="color:var(--danger)">Mehr Gäste als Plätze in den offenen Räumen.</div>`:''}${I.ohneRaum?`<div class="hint">${I.ohneRaum} Gäste ohne Raum.</div>`:''}</div>
        <div><div class="sublbl">Personal${I.depts.some(z=>z.need!==null)?' · eingeteilt / Bedarf':''}${I.depts.some(z=>z.need!==null||z.off)?' · tippen = nicht nötig':''}</div><div class="staffline">${staff}</div>${names?`<div class="names">${names}</div>`:''}${I.depts.some(z=>z.spitze)?`<div class="names" style="color:var(--brass)">Mehr Personal wegen Ankunftsspitze ${esc(I.peak.von)}–${esc(I.peak.bis)}: ${I.peak.p} Gäste${I.peak.p>I.peak.res?' (inkl. geschätzter Laufkundschaft)':''}</div>`:''}</div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:10px">${I.fehlt.length?`<button class="btn sm warn" data-a="who" data-d="${I.d}" data-k="${I.k}" data-abt="${I.fehlt[0].a.id}">Personal zuteilen</button>`:`<button class="btn sm ghost" data-a="who" data-d="${I.d}" data-k="${I.k}" data-abt="">Personal zuteilen</button>`}<button class="btn sm ghost" data-a="res-new" data-d="${I.d}" data-z="${I.k==='M'?'12:00':'18:30'}">+ Reservierung</button></div>
    ${I.res.length?`<div class="reslist">${I.res.map(r=>`<button data-a="res-edit" data-id="${r.id}"><span class="t">${esc(r.zeit)}</span><span class="n">${esc(r.name)}${r.kommentar?` <span style="color:var(--brass)">· ${esc(r.kommentar)}</span>`:''}</span><span class="r">${esc(r.personen)} P.${raumById(r.raum)?' · '+esc(raumById(r.raum).name):''}</span></button>`).join('')}</div>`:''}
  </div>`;
}
/* Personal zuteilen – freie Leute einer Abteilung für einen Dienst */
function openWho(d,k,abt){
  const I=svcInfo(d,k);
  const depts=abt?[dept(abt)]:S.abteilungen;
  const tplFor=a=>S.templates.find(t=>t.abt===a&&shiftIn({von:t.von,bis:t.bis},k)&&!(k==='M'?shiftIn({von:t.von,bis:t.bis},'A'):shiftIn({von:t.von,bis:t.bis},'M')))||S.templates.find(t=>t.abt===a&&shiftIn({von:t.von,bis:t.bis},k));
  let b=`<div class="meta-line">${esc(fmtLong(d))} · ${SVC[k]} · ${I.gaeste} Gäste</div>`;
  b+=`<div class="chips" style="margin:10px 0">${['',...S.abteilungen.map(a=>a.id)].map(id=>`<button data-a="who" data-d="${d}" data-k="${k}" data-abt="${id}" aria-pressed="${abt===id}">${id?esc(dept(id).name):'Alle'}</button>`).join('')}</div>`;
  for(const a of depts){
    const z=I.depts.find(y=>y.a.id===a.id)||{n:0,need:null};
    const people=staffSorted().filter(s=>s.abt===a.id);
    const rows=people.map(s=>{
      const ab=absenceOn(s.id,d), sh=S.shifts.filter(x=>x.staff===s.id&&x.datum===d);
      const here=sh.some(x=>shiftIn(x,k));
      let st,cls='';
      if(here){st='ist schon eingeteilt';cls='ok';}
      else if(ab){st=ab.typ==='Urlaub'?'Urlaub':'nicht da';cls='err';}
      else if(sh.length){st='hat '+sh.map(x=>x.von+'–'+x.bis).join(', ');cls='warn';}
      else st='frei';
      return {s,st,cls,free:!here&&!ab,here};
    }).sort((p,q)=>(q.free-p.free)||((p.s.typ==='springer')?-1:1)-((q.s.typ==='springer')?-1:1));
    const tp=tplFor(a.id);
    b+=`<h3 style="display:flex;align-items:center;gap:6px"><span class="dot" style="--c:${col(a.farbe)}"></span>${esc(a.name)} <span class="muted" style="font-weight:500">${z.n} eingeteilt${z.need!==null?` · Bedarf ${z.need}`:''}</span></h3>`;
    b+=rows.length?rows.map(r=>{
      const msg=`Hallo ${firstName(r.s.name)}, hättest du am ${WDL[wd(d)]}, ${fmtShort(d)} ${k==='M'?'mittags':'abends'} Zeit für einen Dienst (${a.name})? ${S.betrieb.name}`;
      return `<div class="lrow who"><span class="grow"><b>${esc(r.s.name)} ${r.s.typ==='springer'?'<span class="pill">Springer</span>':''}</b><small>${r.cls?`<span class="pill ${r.cls}">${esc(r.st)}</span>`:esc(r.st)}${r.s.tel?' · '+esc(r.s.tel):''}</small></span>
      ${r.free?`<span class="btn-row">${r.s.tel?`<a class="btn sm" href="${telHref(r.s.tel)}">Anrufen</a><a class="btn sm" href="https://wa.me/${phoneIntl(r.s.tel)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="btn sm primary" data-a="who-assign" data-s="${r.s.id}" data-d="${d}" data-t="${tp?tp.id:''}">Einteilen</button></span>`:''}</div>`;
    }).join(''):'<div class="empty">Niemand in dieser Abteilung angelegt.</div>';
  }
  modal('Personal zuteilen',b,`<button class="btn" data-a="mclose">Schließen</button>`);
}

/* ---------- Dienstplan ---------- */
function viewPlan(){
  const from=UI.week,to=addD(from,6),ds=days(from,to),t=today();
  const active=staffSorted().filter(s=>!UI.planDept||s.abt===UI.planDept);
  const inact=S.staff.filter(s=>s.aktiv===false&&(!UI.planDept||s.abt===UI.planDept)&&S.shifts.some(x=>x.staff===s.id&&x.datum>=from&&x.datum<=to));
  const rows=[...active,...inact];
  const idx=indexShifts(from,to);
  const W=conflicts(from,to).filter(w=>!UI.planDept||(staffById(w.s)||{}).abt===UI.planDept);
  const deptsShown=UI.planDept?[dept(UI.planDept)]:S.abteilungen;
  let h=`<div class="toolbar">${weekNav()}<span class="spacer"></span>
    <div class="seg" role="group" aria-label="Ansicht"><button data-a="planmode" data-m="grid" aria-pressed="${UI.planMode==='grid'}">Raster</button><button data-a="planmode" data-m="list" aria-pressed="${UI.planMode==='list'}">Tage</button></div></div>
  <div class="toolbar"><div class="chips" role="group" aria-label="Abteilung"><button data-a="plandept" data-v="" aria-pressed="${!UI.planDept}">Alle</button>${S.abteilungen.map(a=>`<button data-a="plandept" data-v="${a.id}" aria-pressed="${UI.planDept===a.id}"><span class="dot" style="--c:${col(a.farbe)}"></span>${esc(a.name)}</button>`).join('')}</div></div>
  <div class="toolbar"><button class="btn sm" data-a="copyweek">Woche übernehmen…</button><button class="btn sm" data-a="clearweek">Woche leeren</button><button class="btn sm" data-a="rep-preset" data-type="plan" data-p="custom-week">Senden</button><span class="spacer"></span><button class="btn sm primary" data-a="shift-new" data-d="${ds.includes(t)?t:from}">+ Schicht</button></div>`;
  if(!S.staff.length) return h+`<div class="card"><h2>Noch kein Personal</h2><p class="hint">Lege zuerst Service, Küche und Springer an, dann kannst du sie hier per Tipp einteilen.</p><div class="btn-row" style="margin-top:10px"><button class="btn primary" data-a="staff-new">+ Mitarbeiter anlegen</button></div></div>`;
  const W_html=W.length?`<div class="notice warn" style="margin-top:12px"><b>Bitte prüfen:</b> ${W.map(w=>`<a href="#" data-a="cell" data-s="${w.s}" data-d="${w.d}">${esc(fmtDay(w.d))} ${esc((staffById(w.s)||{}).name||'')}</a> – ${esc(w.t)}`).join('; ')}</div>`:'';
  const gastInfo=d=>{const svcs=servicesOf(d);return svcs.map(s=>{const I=svcInfo(d,s.k);return `${SVC[s.k].slice(0,1)} ${I.gaeste}${I.fehlt.length?' ⚠':''}`;}).join(' · ');};
  if(UI.planMode==='grid'){
    h+=`<div class="gridwrap"><table class="plan"><thead><tr><th class="namecol">Mitarbeiter</th>${ds.map(d=>{const o=openInfo(d),hol=holiday(d),gi=o.closed?'':gastInfo(d);return `<th class="${d===t?'today':''} ${o.closed?'closed':''}"><b>${WD[wd(d)]} ${fmtShort(d)}</b><small>${esc(o.closed?(o.note||'geschlossen'):slotsTxt(o))}</small>${hol?`<small class="tag" style="margin-top:2px">${esc(hol)}</small>`:''}${gi?`<span class="resline" title="Gäste Mittag · Abend">Gäste ${esc(gi)}</span>`:''}</th>`;}).join('')}</tr></thead><tbody>`;
    let lastAbt=null;
    for(const s of rows){
      if(!UI.planDept&&s.abt!==lastAbt){lastAbt=s.abt;h+=`<tr class="grp"><th class="namecol" style="background:var(--surface-2)">${esc(dept(s.abt).name)}</th><th colspan="7"></th></tr>`;}
      const cells=ds.map(d=>{
        const sh=idx[s.id+'|'+d]||[], ab=absenceOn(s.id,d), o=openInfo(d);
        let c=ab?`<span class="abs" data-t="${esc(ab.typ)}">${esc(ab.typ)}</span>`:'';
        sh.forEach(x=>{const tp=tplById(x.tpl);c+=`<span class="chip" style="--c:${col(dept(x.abt).farbe)}">${x.von}–${x.bis}${tp&&tp.kurz?`<i>${esc(tp.kurz)}</i>`:''}</span>`;});
        if(!c) c='<span class="plus" aria-hidden="true">+</span>';
        return `<td class="cell ${o.closed?'closed':''} ${d===t?'today':''}"><button class="cellbtn" data-a="cell" data-s="${s.id}" data-d="${d}" aria-label="${esc(s.name)}, ${esc(fmtDay(d))}">${c}</button></td>`;
      }).join('');
      h+=`<tr><th class="namecol"><b>${esc(s.name)}</b><small><span class="dot" style="--c:${col(dept(s.abt).farbe)}"></span>${s.typ==='springer'?'Springer':'Fix'}${s.aktiv===false?' · inaktiv':''}</small></th>${cells}</tr>`;
    }
    h+=`</tbody></table></div><div class="legend">${S.abteilungen.map(a=>`<span><span class="dot" style="--c:${col(a.farbe)}"></span>${esc(a.name)}</span>`).join('')}<span>„Gäste M · A“ = Mittag · Abend, ⚠ = Personal fehlt</span></div>`;
  } else {
    h+=`<div class="stack">`+ds.map(d=>{
      const o=openInfo(d),hol=holiday(d);
      const groups=deptsShown.map(a=>{const it=[];rows.forEach(s=>(idx[s.id+'|'+d]||[]).forEach(x=>{if(x.abt===a.id)it.push({s,x});}));return {a,it:it.sort((p,q)=>p.x.von.localeCompare(q.x.von))};}).filter(g=>g.it.length);

const RES_TAGS=['Geburtstagsfeier','Steakessen','Stammtisch','Sitzung','Firmenfeier','Weihnachtsfeier','Taufe','Hochzeit','Trauerfeier','Kartenrunde'];
function resTags(){

  const cnt={};
  S.reservations.forEach(r=>(r.kommentar||'').split(',').map(x=>x.trim()).filter(x=>x&&x.length<=30).forEach(x=>{cnt[x]=(cnt[x]||0)+1;}));

function openRoom(r){const rm=raumById(r.raum),k=svcOfTime(r.zeit);if(rm&&!roomOpen(r.datum,k,rm)){const key=r.datum+'|'+k;const st=S.raumStatus[key]=S.raumStatus[key]||{};if(roomDefault(r.datum,rm))delete st[rm.id];else st[rm.id]=true;if(!Object.keys(st).length)delete S.raumStatus[key];}}
/* Wiederholung */
const nthOf=d=>{const x=P(d),last=P(addD(d,7)).getMonth()!==x.getMonth();return last&&Math.ceil(x.getDate()/7)>=4?0:Math.ceil(x.getDate()/7);}; // 0 = letzter
const nthTxt=d=>{const n=nthOf(d);return `jeden ${n?n+'.':'letzten'} ${WDL[wd(d)]} im Monat`;};
function seriesDates(start,mode,until){
  const out=[]; if(!mode||!until||until<start) return [start];
  if(mode==='w1'||mode==='w2'){const step=mode==='w1'?7:14;for(let d=start;d<=until&&out.length<120;d=addD(d,step))out.push(d);return out;}
  const w=wd(start), n=nthOf(start), s0=P(start);
  for(let i=0;i<36&&out.length<60;i++){
    const y=s0.getFullYear(), m=s0.getMonth()+i;
    let d;
    if(n){const first=new Date(y,m,1);const off=(w-((first.getDay()+6)%7)+7)%7;const day=1+off+(n-1)*7;const x=new Date(y,m,day);if(x.getMonth()!==((m%12)+12)%12)continue;d=iso(x);}
    else{const lastD=new Date(y,m+1,0);const off=(((lastD.getDay()+6)%7)-w+7)%7;d=iso(new Date(y,m+1,-off));}
    if(d>until) break; if(d>=start) out.push(d);
  }
  return out;
}

function updResWarn(){

  }
  el.innerHTML=h;
}

/* ---------- Backup / Import ---------- */
function backupName(){const d=new Date();return `GasthofRatz_Backup_${iso(d)}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;}
function backupJSON(data=S){return JSON.stringify({app:APP_ID,version:VERSION,exported:new Date().toISOString(),data},null,1);}
function markBackup(){S.meta.lastBackup=Date.now();writeData();render();}
/* Ein Knopf "Backup sichern": am Handy Teilen-Menü (Drive, Mail, Dateien …), sonst Download; in der Testversion als Text */
async function backupSave(){
  if(ART){ACT['backup-text']();return;}
  const json=backupJSON(), name=backupName();
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup '+S.betrieb.name});markBackup();toast('Backup gesichert');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  download(name,json,'application/json'); markBackup(); toast('Backup gespeichert (Ordner „Downloads“)');
}
function extractBackup(obj){
  const d=(obj&&obj.app===APP_ID&&obj.data)?obj.data:obj;
  if(!d||typeof d!=='object'||!Array.isArray(d.staff)||!Array.isArray(d.shifts)) throw new Error('Das ist kein Backup dieses Planers.');
  return migrate(d);
}
let pendingImport=null;
function confirmImport(data,when,source){
  pendingImport=data;
  modal('Backup einspielen',`<p>${source}${when?` vom <b>${esc(fmtTS(when))}</b>`:''}</p>
  <div class="notice">${data.staff.length} Personen · ${data.shifts.length} Schichten · ${data.reservations.length} Reservierungen</div>
  ${S?`<div class="notice warn">Die aktuellen Daten auf diesem Gerät werden <b>ersetzt</b>. Vorher wird automatisch gesichert.</div>`:''}`,
  `<button type="button" class="btn" data-a="mclose">Abbrechen</button><button type="button" class="btn primary" data-a="import-do">Einspielen</button>`,'small');
}
function doImport(){
  if(!pendingImport) return;
  if(S){addSnap('Vor dem Einspielen eines Backups');undoStack.push(JSON.stringify(S));}
  S=pendingImport; pendingImport=null; S.meta.lastBackup=Date.now();
  writeData(); closeModal(); UI.tab='start'; render(); toast('Backup eingespielt',{undo:undoStack.length>0});
}
function readImportFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);confirmImport(extractBackup(obj),obj.exported,'Datei „'+esc(file.name)+'“');}catch(e){toast('Datei konnte nicht gelesen werden: '+e.message,{err:true});}};
  r.readAsText(file);
}

    ahmet:mk('Ahmet Yilmaz','abwasch','fix')
  };
  S.staff.push(...Object.values(st));

    thomas:{1:'KM',2:'KA',3:'KA',4:'KA',5:'KA',6:'KM'},elena:{1:'KA',2:'KM',3:'KM',4:'KM',5:'KM'},paul:{5:'KA'},ahmet:{4:'AA',5:'AA'}};
  for(let w=0;w<2;w++) for(const [k,ds] of Object.entries(plan)) for(const [i,code] of Object.entries(ds)){

  S.reservations.push(R(0,'19:00','Familie Berger',6,'gaststube'),R(2,'18:30','Firma Kolb',35,'saal'),R(2,'19:30','Herr Ott',2,'gaststube'),

  S.reservations.forEach(r=>{const k=Object.keys(kom).find(n=>r.name.startsWith(n));if(k)r.kommentar=kom[k];});

  const st0=S.reservations.find(r=>r.name.startsWith('Stammtisch')); st0.kommentar='Stammtisch'; st0.serie=uid();

function removeSample(){

}

/* ---------- Reports ---------- */
const PERIODS=[['thisweek','Diese Woche'],['nextweek','Nächste Woche'],['thismonth','Dieser Monat'],['nextmonth','Nächster Monat'],['custom','Eigener Zeitraum']];
const REPTYPES=[['week','Wochenvorschau (Gäste & Personal)'],['plan','Dienstplan'],['person','Dienstplan einer Person'],['res','Reservierungen'],['open','Offen Mittag / Abend']];
function periodRange(p){
  const t=today(), m=monday(t), d=P(t);
  switch(p){
    case 'thisweek': return [m,addD(m,6)];
    case 'nextweek': return [addD(m,7),addD(m,13)];
    case 'thismonth': return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))];
    case 'nextmonth': return [iso(new Date(d.getFullYear(),d.getMonth()+1,1)),iso(new Date(d.getFullYear(),d.getMonth()+2,0))];
    default:{let a=UI.rep.from||t,b=UI.rep.to||addD(t,6);if(b<a)[a,b]=[b,a];if(dayDiff(a,b)>92)b=addD(a,92);return [a,b];}
  }
}
const absLabel=ab=>!ab?'':ab.typ==='Urlaub'?'Urlaub':'frei';
function chunkWeeks(ds){const w=[];let cur=[];ds.forEach(d=>{if(cur.length&&wd(d)===0){w.push(cur);cur=[];}cur.push(d);});if(cur.length)w.push(cur);return w;}
function buildReport(){
  const r=UI.rep, [from,to]=periodRange(r.period);
  const rep=({week:repWeek,plan:repPlan,person:repPerson,res:repRes,open:repOpen}[r.type]||repWeek)(from,to,r);
  rep.from=from; rep.to=to; return rep;
}
function repWeek(from,to){
  let html='', text=`*Wochenvorschau ${S.betrieb.name}*\n${rangeTxt(from,to)}\n`;
  for(const d of days(from,to)){
    const o=openInfo(d), hol=holiday(d);
    html+=`<section class="rep-day"><h3>${esc(WDL[wd(d)])}, ${esc(fmtDate(d))}${hol?' · '+esc(hol):''} <span class="sub">${esc(slotsTxt(o))}</span></h3>`;
    text+=`\n*${fmtDay(d)}*${hol?' '+hol:''}${o.closed?' – '+(o.note||'geschlossen'):''}\n`;
    if(o.closed){html+='</section>';continue;}
    html+=`<table class="rep-tbl"><thead><tr><th style="width:70px"></th><th class="r" style="width:60px">Gäste</th><th>Offene Räume</th><th>Personal</th></tr></thead><tbody>`;
    for(const s of servicesOf(d)){
      const I=svcInfo(d,s.k);
      const rooms=I.rooms.filter(z=>z.open).map(z=>z.r.name+(z.pers?` (${z.pers})`:'')).join(', ')||'–';
      const staff=I.depts.filter(z=>z.list.length||z.need||z.off).map(z=>z.off?`<b>${esc(z.a.name)}</b>: nicht nötig`:`<b>${esc(z.a.name)}</b> ${z.n}${z.need!==null?'/'+z.need:''}: ${z.list.map(y=>esc(firstName(y.s.name))+' '+y.x.von).join(', ')||'–'}${z.need!==null&&z.need>z.n?` <em>${z.need-z.n} fehlt</em>`:''}`).join('<br>');

function repPlan(from,to,r){

function repOpen(from,to){
  const wtxt=w=>slotsTxt({closed:!w.m&&!w.a,m:w.m,a:w.a,note:'Ruhetag'});
  const tbl=weekly=>`<table class="rep-tbl"><thead><tr><th style="width:120px"></th><th>Mittag</th><th>Abend</th></tr></thead><tbody>${WDL.map((n,i)=>{const w=weekly[i];return `<tr class="${!w.m&&!w.a?'closed':''}"><th>${n}</th><td>${w.m?'offen':'–'}</td><td>${w.a?'offen':'–'}</td></tr>`;}).join('')}</tbody></table>`;
  const seas=(S.hours.seasons||[]).filter(z=>z.von&&z.bis);
  let html=`<h2>Standard${seas.length?' (übriges Jahr)':''}</h2>`+tbl(S.hours.weekly);
  let text=`*Geöffnet ${S.betrieb.name}*\n\n_Standard_\n`+WDL.map((n,i)=>`${n}: ${wtxt(S.hours.weekly[i])}`).join('\n');
  seas.forEach(z=>{html+=`<h2>${esc(z.name)} · ${esc(mdTxt(z.von))} – ${esc(mdTxt(z.bis))}</h2>`+tbl(z.weekly);text+=`\n\n_${z.name} (${mdTxt(z.von)} – ${mdTxt(z.bis)})_\n`+WDL.map((n,i)=>`${n}: ${wtxt(z.weekly[i])}`).join('\n');});
  const ex=[]; days(from,to).forEach(d=>{const sp=S.hours.special.find(x=>d>=x.von&&d<=(x.bis||x.von)),ho=holidayObj(d);if(sp||(ho&&ho.frei))ex.push({d,why:sp?(sp.name||''):ho.n,txt:slotsTxt(openInfo(d))});});
  if(ex.length){html+=`<h2>Abweichungen ${esc(rangeTxt(from,to))}</h2><table class="rep-tbl"><tbody>${ex.map(e=>`<tr><th style="width:120px">${esc(fmtDay(e.d))}</th><td>${esc(e.why)}</td><td>${esc(e.txt)}</td></tr>`).join('')}</tbody></table>`;text+=`\n\n*Abweichungen*\n`+ex.map(e=>`${fmtDay(e.d)} ${e.why}: ${e.txt}`).join('\n');}
  return {title:'Geöffnet Mittag / Abend',sub:'',html,text};
}

    const v=await choice(`${s.name} löschen?`,'<p>Wer nicht mehr bei euch arbeitet, lässt sich auch einfach auf „nicht mehr da“ setzen. Dann bleiben alte Dienstpläne vollständig.</p>',[{v:'',l:'Abbrechen'},{v:'off',l:'Nicht mehr da',cls:'primary'},{v:'del',l:'Löschen',cls:'danger'}]);
    if(v==='off'){commit('Gespeichert',()=>{s.aktiv=false;});closeModal();}
    if(v==='del'){commit('Gelöscht',()=>{S.staff=S.staff.filter(x=>x.id!==s.id);S.shifts=S.shifts.filter(x=>x.staff!==s.id);S.absences=S.absences.filter(a=>a.staff!==s.id);});closeModal();}
  },
  'abs-new':d=>openAbsForm({sid:d.s,d:d.d}),
  'abs-edit':d=>openAbsForm({id:d.id}),
  'abs-del':d=>{commit('Gelöscht',()=>{S.absences=S.absences.filter(a=>a.id!==d.id);});closeModal();},
  'rep-person':d=>{UI.rep.type='person';UI.rep.staff=d.id;go('reports');},

  // Reservierungen
  'res-new':d=>openResForm({d:d.d,z:d.z}),
  'res-edit':d=>openResForm({id:d.id}),
  'res-del':async d=>{
    const x=S.reservations.find(r=>r.id===d.id); if(!x) return;
    const later=x.serie?S.reservations.filter(r=>r.serie===x.serie&&r.id!==x.id&&r.datum>x.datum):[];
    const c=later.length?await choice('Serientermin löschen',`<p>Danach folgen noch ${later.length} Termine dieser Serie.</p>`,[{v:'',l:'Abbrechen'},{v:'one',l:'Nur diesen',cls:'danger'},{v:'all',l:'Auch alle folgenden',cls:'danger'}]):(await ask('Reservierung löschen?','','Löschen',true)?'one':'');
    if(!c) return;
    const ids=new Set([x.id,...(c==='all'?later.map(r=>r.id):[])]);
    commit(ids.size>1?`${ids.size} Termine gelöscht`:'Reservierung gelöscht',()=>{S.reservations=S.reservations.filter(r=>!ids.has(r.id));});closeModal();
  },
  'res-tag':d=>{const el=$('#rs-k');if(!el)return;const parts=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(!parts.includes(d.t))parts.push(d.t);el.value=parts.join(', ');},
  resfilter:d=>{UI.resFilter=d.v;render();},

  // Betrieb
  'tpl-new':()=>openTplForm(),
  'tpl-edit':d=>openTplForm(d.id),
  'tpl-del':d=>{commit('Vorlage gelöscht',()=>{S.templates=S.templates.filter(t=>t.id!==d.id);});closeModal();},
  'special-new':()=>openSpecialForm(),
  'season-add':()=>{applyHoursForm();commit(null,()=>{(S.hours.seasons=S.hours.seasons||[]).push({id:uid(),name:'Neue Saison',von:'',bis:'',weekly:S.hours.weekly.map(w=>({...w}))});});toast('Saison angelegt: Name, Zeitraum und Tage einstellen, dann speichern');},
  'season-del':async d=>{const z=(S.hours.seasons||[]).find(x=>x.id===d.id);if(!z)return;if(await ask(`„${z.name}“ entfernen?`,'In diesem Zeitraum gilt dann wieder der Standard.','Entfernen',true)){applyHoursForm();commit('Saison entfernt',()=>{S.hours.seasons=S.hours.seasons.filter(x=>x.id!==z.id);});}},
  'day-open':d=>{commit(`${fmtDay(d.d)} ausnahmsweise offen`,()=>{S.hours.special.push({id:uid(),name:'Ausnahmsweise offen',von:d.d,bis:d.d,m:true,a:true});});},
  'special-edit':d=>openSpecialForm(d.id),
  'special-del':d=>{commit('Gelöscht',()=>{S.hours.special=S.hours.special.filter(x=>x.id!==d.id);});closeModal();},
  'abt-add':()=>{applyAbtForm();commit(null,()=>{S.abteilungen.push({id:uid(),name:'Neue Abteilung',farbe:'#6b7f8f',jeGaeste:0,min:0});});},
  'abt-del':async d=>{
    const a=S.abteilungen.find(x=>x.id===d.id); if(!a) return;
    if(S.abteilungen.length<=1){toast('Mindestens eine Abteilung wird gebraucht',{err:true});return;}
    const n=S.staff.filter(s=>s.abt===a.id).length;
    if(await ask(`„${a.name}“ entfernen?`,n?`${n} Personen sind dieser Abteilung zugeordnet und landen danach unter „Sonstige“.`:'','Entfernen',true)){applyAbtForm();commit('Abteilung entfernt',()=>{S.abteilungen=S.abteilungen.filter(x=>x.id!==a.id);});}
  },
  'raum-add':()=>{applyAbtForm();commit(null,()=>{S.raeume.push({id:uid(),name:'Neuer Raum',plaetze:0,standard:false,saisonVon:'',saisonBis:''});});},
  'raum-del':async d=>{
    const r=raumById(d.id); if(!r) return;
    const n=S.reservations.filter(x=>x.raum===r.id).length;
    if(await ask(`„${r.name}“ entfernen?`,n?`${n} Reservierungen sind diesem Raum zugeordnet und stehen danach ohne Raum da.`:'','Entfernen',true)){applyAbtForm();commit('Raum entfernt',()=>{S.raeume=S.raeume.filter(x=>x.id!==r.id);});}
  },

  // Reports
  'rep-preset':d=>{UI.rep.type=d.type;if(d.p==='custom-week'){UI.rep.period='custom';UI.rep.from=UI.week;UI.rep.to=addD(UI.week,6);UI.rep.dept=d.type==='plan'?UI.planDept:'';}else UI.rep.period=d.p;go('reports');},
  'rep-period':d=>{UI.rep.period=d.p;if(d.p==='custom'&&!UI.rep.from){const [a,b]=periodRange('nextweek');UI.rep.from=a;UI.rep.to=b;}saveUI();render();},
  'rep-print':()=>repPrint(),
  'rep-copy':()=>copyText(buildReport().text),
};

/* ---------- Formulare ---------- */
const fd=f=>Object.fromEntries(new FormData(f).entries());
function applyHoursForm(v){
  if(!v){const f=$('#f-hours'); if(!f) return; v=fd(f);}
  const read=key=>WDL.map((_,i)=>({m:!!v[`m_${key}_${i}`],a:!!v[`a_${key}_${i}`]}));
  S.hours.weekly=read('std');
  (S.hours.seasons||[]).forEach(z=>{if(v['sn_'+z.id]===undefined)return;z.name=v['sn_'+z.id].trim()||z.name;z.von=mdRead(v,'sv_'+z.id);z.bis=mdRead(v,'sb_'+z.id);z.weekly=read(z.id);});
}
function applyAbtForm(){
  const f=$('#f-abt'); if(!f) return; const v=fd(f);
  S.abteilungen.forEach(a=>{if(v['an_'+a.id]!==undefined){a.name=v['an_'+a.id].trim()||a.name;a.farbe=col(v['ac_'+a.id]);}});
  S.raeume.forEach(r=>{if(v['rn_'+r.id]!==undefined){r.name=v['rn_'+r.id].trim()||r.name;r.plaetze=+v['rp_'+r.id]||0;r.standard=!!v['rs_'+r.id];
    const a=mdRead(v,'rsv_'+r.id), b=mdRead(v,'rsb_'+r.id);
    if(a&&b){r.saisonVon=a;r.saisonBis=b;} else {r.saisonVon='';r.saisonBis='';}}});
}
const FORMS={
  shift:f=>{
    const v=fd(f); if(!v.staff){toast('Bitte Mitarbeiter wählen',{err:true});return;}
    const data={staff:v.staff,datum:v.datum,von:v.von,bis:v.bis,abt:v.abt,tpl:v.tpl||''};
    const ab=absenceOn(v.staff,v.datum);
    commit(v.id?'Schicht geändert':'Schicht eingetragen',()=>{if(v.id)Object.assign(S.shifts.find(x=>x.id===v.id),data);else S.shifts.push({id:uid(),...data});});
    if(ab) toast(`Achtung: ${staffById(v.staff).name} hat an diesem Tag ${ab.typ}`,{err:true});
    closeModal();
  },
  staff:f=>{
    const v=fd(f), data={name:v.name.trim(),abt:v.abt,typ:v.typ,tel:(v.tel||'').trim(),aktiv:!!v.aktiv};
    if(!data.name) return;
    commit(v.id?'Gespeichert':'Angelegt',()=>{if(v.id)Object.assign(staffById(v.id),data);else S.staff.push({id:uid(),...data});});
    closeModal();
  },
  abs:f=>{
    const v=fd(f); if(!v.staff){toast('Bitte Mitarbeiter wählen',{err:true});return;}
    let von=v.von,bis=v.bis||v.von; if(bis<von)[von,bis]=[bis,von];
    const data={staff:v.staff,typ:v.typ,von,bis};
    commit('Eingetragen',()=>{
      if(v.id)Object.assign(S.absences.find(a=>a.id===v.id),data);else S.absences.push({id:uid(),...data});
      if(v.delShifts) S.shifts=S.shifts.filter(x=>!(x.staff===data.staff&&x.datum>=von&&x.datum<=bis));
    });
    closeModal();
  },
  res:async f=>{
    const v=fd(f), data={zeit:v.zeit,name:v.name.trim(),personen:Math.max(1,+v.personen||1),raum:v.raum||'',kommentar:(v.kommentar||'').trim().replace(/^,\s*|,\s*$/g,'')};
    if(v.id){
      const x=S.reservations.find(r=>r.id===v.id); if(!x) return;
      const later=x.serie?S.reservations.filter(r=>r.serie===x.serie&&r.id!==x.id&&r.datum>x.datum):[];
      let all=false;
      if(later.length){const c=await choice('Serientermin ändern',`<p>Diese Reservierung gehört zu einer Serie. Danach folgen noch ${later.length} Termine.</p><p class="hint">Bei „alle folgenden“ werden Name, Personen, Uhrzeit, Raum und Kommentar übernommen. Das Datum ändert sich nur bei diesem Termin.</p>`,[{v:'',l:'Abbrechen'},{v:'one',l:'Nur diesen'},{v:'all',l:'Auch alle folgenden',cls:'primary'}]);if(!c)return;all=c==='all';}
      commit(all?`${later.length+1} Termine geändert`:'Reservierung gespeichert',()=>{Object.assign(x,data,{datum:v.datum});openRoom(x);if(all)later.forEach(r=>{Object.assign(r,data);openRoom(r);});});
    } else {
      const ds=seriesDates(v.datum,v.wdh||'',v.wdhBis), serie=ds.length>1?uid():'';
      commit(ds.length>1?`${ds.length} Termine eingetragen`:'Reservierung eingetragen',()=>{ds.forEach(dt=>{const r={id:uid(),datum:dt,...data};if(serie)r.serie=serie;S.reservations.push(r);openRoom(r);});});
    }
    closeModal();
  },
  tpl:f=>{
    const v=fd(f), data={name:v.name.trim(),kurz:(v.kurz||'').trim(),abt:v.abt,von:v.von,bis:v.bis};
    commit('Vorlage gespeichert',()=>{if(v.id)Object.assign(tplById(v.id),data);else S.templates.push({id:uid(),...data});});
    closeModal();
  },
  special:f=>{
    const v=fd(f); let von=v.von,bis=v.bis||v.von; if(bis<von)[von,bis]=[bis,von];
    const data={name:(v.name||'').trim(),von,bis,m:!!v.m,a:!!v.a};
    commit('Gespeichert',()=>{if(v.id)Object.assign(S.hours.special.find(x=>x.id===v.id),data);else S.hours.special.push({id:uid(),...data});});
    closeModal();
  },
  hours:f=>{
    const v=fd(f);
    commit('Gespeichert',()=>{
      applyHoursForm(v);
      S.betrieb.feiertagRegel=v.feiertagRegel; S.betrieb.abendAb=v.abendAb||'16:00';
    });
    const bad=(S.hours.seasons||[]).filter(z=>!z.von||!z.bis);
    if(bad.length) toast(`Bei „${bad[0].name}“ fehlt der Zeitraum, die Saison gilt so nicht`,{err:true});
  },
  abt:()=>commit('Gespeichert',applyAbtForm),
  betrieb:f=>{const v=fd(f);commit('Gespeichert',()=>{Object.assign(S.betrieb,{name:v.name.trim()||'Gasthof Ratz',adresse:v.adresse.trim(),telefon:v.telefon.trim()});});},
  copyweek:f=>{
    const v=fd(f), src=monday(v.src), off=dayDiff(src,UI.week);
    if(off===0){toast('Das ist dieselbe Woche',{err:true});return;}
    const to=addD(UI.week,6), inDept=x=>!UI.planDept||x.abt===UI.planDept;
    const source=S.shifts.filter(x=>x.datum>=src&&x.datum<=addD(src,6)&&inDept(x));
    if(!source.length){toast('In dieser Woche sind keine Schichten eingetragen',{err:true});return;}
    let added=0,skipped=0;
    commit(null,()=>{
      if(v.replace) S.shifts=S.shifts.filter(x=>!(x.datum>=UI.week&&x.datum<=to&&inDept(x)));
      source.forEach(x=>{
        const nd=addD(x.datum,off), s=staffById(x.staff);
        if(!s||s.aktiv===false||absenceOn(x.staff,nd)||openInfo(nd).closed||S.shifts.some(z=>z.staff===x.staff&&z.datum===nd&&z.von===x.von)){skipped++;return;}
        S.shifts.push({...x,id:uid(),datum:nd}); added++;
      });
    });
    closeModal(); toast(`${added} Schichten übernommen${skipped?`, ${skipped} übersprungen`:''}`,{undo:true});
  }
};

/* ---------- Eingaben ---------- */
const CH={
  planweek:el=>{if(el.value){UI.week=monday(el.value);render();}},
  rep:el=>{UI.rep[el.name]=el.value;saveUI();render();},
  tplfill:el=>{const t=tplById(el.value),f=el.form;if(!t)return;f.von.value=t.von;f.bis.value=t.bis;f.abt.value=t.abt;},
  shiftstaff:el=>{const s=staffById(el.value);if(s&&!el.form.tpl.value)el.form.abt.value=s.abt;},
  resdt:()=>updResWarn(),
  pastabs:el=>{UI.showPastAbs=el.checked;render();},
  pastspecial:el=>{UI.showPastSpecial=el.checked;render();},
  erwartet:el=>{const n=Math.max(0,parseInt(el.value,10)||0);commit(null,()=>{if(n)S.erwartet[el.dataset.key]=n;else delete S.erwartet[el.dataset.key];});}
};
let resqTimer;
const IN={resq:el=>{clearTimeout(resqTimer);resqTimer=setTimeout(()=>{UI.resQ=el.value;const pos=el.selectionStart;render();const n=$('#resq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},220);}};
function persist(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}}

/* ---------- Start ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]'); if(!a||a.closest('#ask-root')) return;
  const fn=ACT[a.dataset.a]; if(fn) fn(a.dataset,a,e);
});
document.addEventListener('submit',e=>{const fn=FORMS[e.target.dataset.form];if(fn){e.preventDefault();fn(e.target);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ask-root').hidden&&!$('#modal-root').hidden)closeModal();});
$('#importfile').addEventListener('change',e=>readImportFile(e.target.files[0]));
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();render();}});
$('#rep-style').textContent=REP_CSS;
S=load(); loadUI(); dailySnap(); persist(); render();
</script>
</body>
