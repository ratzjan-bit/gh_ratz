<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gasthof Ratz">
<title>Gasthof Ratz Dienstplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23244f3b'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23f3e7cf'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell — sticky green header, scrolling content, fixed bottom tab bar. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface-2:#e8ece4; --ink:#17201a; --muted:#5b675f; --line:#d3dacf;
  --accent:#244f3b; --accent-ink:#ffffff; --accent-soft:#dbe8df;
  --head-bg:#244f3b; --head-ink:#ffffff;
  --brass:#9a6f22; --brass-soft:#f3e7cf;
  --warn:#9a5b00; --warn-soft:#fbeed6; --danger:#b3261e; --danger-soft:#f9e0dd; --ok:#23704a; --ok-soft:#dcf0e3;
  --hatch:#e3e7df; --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 16px rgba(20,40,28,.06);
  --font-display:'Zilla Slab','Roboto Slab',Rockwell,Georgia,'Times New Roman',serif;
  --font-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101512; --surface:#18201b; --surface-2:#222c26; --ink:#e7ece6; --muted:#9aa89f; --line:#2f3b34;
    --accent:#5aa67f; --accent-ink:#06140c; --accent-soft:#1f3a2c; --head-bg:#17291f; --head-ink:#e7ece6;
    --brass:#d4a654; --brass-soft:#3a2f1a; --warn:#e3a54d; --warn-soft:#3a2c14; --danger:#ef8079; --danger-soft:#3d1f1d;
    --ok:#6cc99a; --ok-soft:#173326; --hatch:#212a24; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201b; --surface-2:#222c26; --ink:#e7ece6; --muted:#9aa89f; --line:#2f3b34;
  --accent:#5aa67f; --accent-ink:#06140c; --accent-soft:#1f3a2c; --head-bg:#17291f; --head-ink:#e7ece6;
  --brass:#d4a654; --brass-soft:#3a2f1a; --warn:#e3a54d; --warn-soft:#3a2c14; --danger:#ef8079; --danger-soft:#3d1f1d;
  --ok:#6cc99a; --ok-soft:#173326; --hatch:#212a24; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:15px;font-family:var(--font-body);font-weight:600;margin:14px 0 6px}
small{font-size:12px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.app-head{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1.05}
.brand small{display:block;font-family:var(--font-body);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.78;font-weight:600;margin-top:2px}
.spacer{flex:1}
.head-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:inherit;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
.head-btn .dot{width:8px;height:8px;border-radius:50%;background:#7fd3a5}
.head-btn.due .dot{background:#f0b44c}

main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:10px;min-width:0}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){ nav.tabs{max-width:720px;margin:0 auto;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0} }

/* Generic */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card > h2{margin-bottom:10px}
[id^="sec-"]{scroll-margin-top:84px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h2{margin:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--danger);border-color:var(--danger-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:8px 11px;font-size:18px;line-height:1}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,#888);flex:none}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--danger-soft);color:var(--danger)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--brass-soft);color:var(--brass)}
.tag.closed{background:var(--surface-2);color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:14px;margin:8px 0}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,input.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;min-height:42px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.fstack{display:flex;flex-direction:column;gap:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.wdpick{display:flex;gap:4px;flex-wrap:wrap}
.wdpick label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer}

/* Start */
.hero{display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.hero-date{font-family:var(--font-display);font-size:24px;font-weight:600}
.open-state{margin-top:6px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.open-state::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok)}
.open-state.is-closed::before{background:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.quick .btn{justify-content:flex-start;padding:12px;white-space:normal;text-align:left}
.duty-dept{margin-top:8px}
.duty-dept:first-child{margin-top:0}
.duty-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow .grow b{display:block;overflow:hidden;text-overflow:ellipsis}
.lrow .grow small{color:var(--muted);display:block}
button.lrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;padding:9px 2px}
button.lrow:hover{background:var(--surface-2)}
.wlist .lrow{font-size:14px;align-items:flex-start}
.wico{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.wico.err{background:var(--danger)} .wico.warn{background:var(--warn)}

/* Plan */
.weeknav{display:flex;align-items:center;gap:6px}
.weekpick{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;text-align:center;cursor:pointer;min-width:150px}
.weekpick b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.1}
.weekpick small{color:var(--muted)}
.weekpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
table.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:12.5px}
.plan th,.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0;text-align:left}
.plan tr > :last-child{border-right:0}
.plan thead th{background:var(--surface-2);padding:7px 6px;font-weight:600}
.plan thead th b{display:block;font-size:13px}
.plan thead th small{display:block;color:var(--muted);font-weight:500;font-size:11px;line-height:1.3}
.plan thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.plan thead th.closed{color:var(--muted)}
.plan .namecol{position:sticky;left:0;z-index:2;background:var(--surface);width:128px;min-width:128px;max-width:150px;padding:7px 8px;border-right:1px solid var(--line)}
.plan thead .namecol{z-index:3;background:var(--surface-2)}
.plan .namecol b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .namecol small{color:var(--muted);display:flex;align-items:center;gap:4px}
.plan td.cell{min-width:98px}
.plan td.closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.plan td.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.cellbtn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;min-height:54px;padding:5px;cursor:pointer}
.cellbtn:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.cellbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cellbtn .plus{color:var(--line);font-size:20px;line-height:1;margin:auto;font-weight:300}
.chip{display:block;border-left:3px solid var(--c,#888);background:var(--surface-2);background:color-mix(in srgb,var(--c,#888) 15%,var(--surface));border-radius:4px;padding:2px 5px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip i{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.chip.inline{display:inline-block}
.abs{display:block;border-radius:4px;padding:2px 5px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.abs[data-t="Urlaub"]{background:var(--brass-soft);color:var(--brass)}
.abs[data-t="Krank"]{background:var(--danger-soft);color:var(--danger)}
.plan td.hrs{padding:7px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:74px}
.plan td.hrs b{font-size:14px}
.plan td.hrs small{color:var(--muted)}
.plan td.hrs.over b{color:var(--warn)}
.plan tfoot td,.plan tfoot th{background:var(--surface-2);padding:6px;border-bottom:0}
.cnts{display:flex;gap:4px;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt.zero{color:var(--danger)}
.resline{display:block;color:var(--brass);font-weight:600;font-size:11px}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dayhead small{display:block;color:var(--muted)}
.day.is-today .dayhead{box-shadow:inset 4px 0 0 var(--accent)}
.day.is-closed .dayhead{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,var(--surface-2) 6px 12px)}
.daybody{padding:6px 14px 10px}
.dgroup{padding:6px 0}
.dgroup + .dgroup{border-top:1px dashed var(--line)}
.drow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:5px 0;cursor:pointer;flex-wrap:wrap}
.drow .nm{min-width:120px;flex:1;font-weight:600}
.absline{font-size:13px;color:var(--muted);padding-top:6px}

/* Reservations */
.resday{padding:0;overflow:hidden}
.res-item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:56px 1fr auto;gap:4px 12px;align-items:start;width:100%;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res-item:last-child{border-bottom:0}
.res-item:hover{background:var(--surface-2)}
.res-time{font-family:var(--font-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.res-main{min-width:0}
.res-main b{display:block}
.res-main small{display:block;color:var(--muted)}
.res-main .note{color:var(--ink);opacity:.85;font-style:italic}
.res-pax{text-align:right;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.1}
.res-pax small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:500}
.res-item.st-storniert .res-main b,.res-item.st-storniert .res-time{text-decoration:line-through;color:var(--muted)}
.search{flex:1;min-width:160px}

/* Setup */
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.hrow{display:grid;grid-template-columns:92px 104px 1fr;gap:8px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hday{font-weight:700}
.hslots{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.hslots span,.hslots label{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.hslots input{border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface);min-height:36px;font-size:15px;width:auto}
.hrow.is-zu .hslots{opacity:.4}
@media (max-width:560px){ .hrow{grid-template-columns:1fr auto} .hslots{grid-column:1 / -1} }
.erow{display:flex;gap:8px;align-items:center;padding:5px 0}
.erow input[type="color"]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.erow input.inp{flex:1;min-width:0}
.erow input.inp.n{flex:0 0 90px}
.snap{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.snap:last-child{border-bottom:0}
.snap .grow{flex:1;min-width:180px}
.dangerzone{border-color:var(--danger-soft)}

/* Reports */
.repcfg .frow{margin-top:10px}
.repactions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.paper{background:#fff;color:#16181a;border-radius:8px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}

/* Modal */
#modal-root,#ask-root{position:fixed;inset:0;z-index:100}
#ask-root{z-index:110}
.mback{position:absolute;inset:0;background:rgba(10,18,13,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:100%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
.modal.small{max-width:440px}
@media (min-width:700px){ .mback{align-items:center;padding:24px} .modal{border-radius:18px;max-height:calc(100% - 48px)} }
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){ .modal{animation:none} }
.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mhead h2{flex:1;font-size:20px}
.xbtn{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.mbody{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.mfoot .left{margin-right:auto}
.meta-line{color:var(--muted);font-size:14px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tplbtn{text-align:left;border:1px solid var(--line);border-left:4px solid var(--c,#888);background:var(--surface);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tplbtn:hover{background:var(--surface-2)}
.tplbtn small{color:var(--muted);font-variant-numeric:tabular-nums}

<script>
'use strict';
/* ==========================================================================
   Gasthof Ratz – Dienstplan, Personal, Öffnungszeiten, Reservierungen, Reports
   Alle Daten liegen lokal im Browser (localStorage). Backups als JSON-Datei.
   ========================================================================== */
const APP_ID='gasthof-ratz-planer', VERSION=1;
const KEY='gasthofRatz.data.v1', SNAP_KEY='gasthofRatz.snapshots.v1', UI_KEY='gasthofRatz.ui.v1';
const MAX_SNAPS=8;

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d);};
const wd=s=>(P(s).getDay()+6)%7;           // Mo=0 … So=6
const monday=s=>addD(s,-wd(s));
const today=()=>iso(new Date());
const dayNum=s=>Math.round(P(s).getTime()/864e5);
const dayDiff=(a,b)=>dayNum(b)-dayNum(a);
const days=(a,b)=>{const r=[];let d=a;let g=0;while(d<=b&&g<800){r.push(d);d=addD(d,1);g++;}return r;};
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const fmtShort=d=>{const x=P(d);return `${pad(x.getDate())}.${pad(x.getMonth()+1)}.`;};
const fmtDate=d=>{const x=P(d);return `${pad(x.getDate())}.${pad(x.getMonth()+1)}.${x.getFullYear()}`;};
const fmtDay=d=>`${WD[wd(d)]} ${fmtShort(d)}`;
const fmtLong=d=>P(d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTS=ts=>new Date(ts).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});
const fmtH=m=>(Math.round(m/60*100)/100).toLocaleString('de-DE',{maximumFractionDigits:2});
const rangeTxt=(a,b)=>a===b?fmtDate(a):`${fmtShort(a)} – ${fmtDate(b)}`;
const tmin=t=>{if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+(m||0);};
const rawDur=(a,b)=>{let d=tmin(b)-tmin(a);if(d<=0)d+=1440;return d;};
const shiftMin=x=>Math.max(0,rawDur(x.von,x.bis)-(+x.pause||0));
const absStart=x=>dayNum(x.datum)*1440+tmin(x.von);
const absEnd=x=>absStart(x)+rawDur(x.von,x.bis);
const col=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#888888';
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`;
const kw=d=>{const t=P(d);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7);};
const byTime=(a,b)=>(a.datum||'').localeCompare(b.datum||'')||(a.von||a.zeit||'').localeCompare(b.von||b.zeit||'');
const firstName=n=>String(n||'').split(' ')[0];

const ABS_TYPES=['Urlaub','Krank','Frei-Wunsch','Berufsschule','Sonstiges'];
const VERTRAG=['Vollzeit','Teilzeit','Minijob','Aushilfe','Auszubildende/r','Saisonkraft'];
const RES_STATUS=[['angefragt','Angefragt','warn'],['bestaetigt','Bestätigt','ok'],['storniert','Storniert','']];
const ANLAESSE=['Geburtstag','Familienfeier','Firmenfeier','Weihnachtsfeier','Taufe','Kommunion/Konfirmation','Hochzeit','Trauerfeier','Stammtisch','Vereinsabend','Geschäftsessen','Reisegruppe'];
const REGIONS=[['DE-BW','Deutschland – Baden-Württemberg'],['DE-BY','Deutschland – Bayern'],['DE','Deutschland – nur bundesweite'],['AT','Österreich'],['none','keine Feiertage anzeigen']];

/* ---------- Data ---------- */
let S=null;
let storageOK=true;
const UI={tab:'start',week:monday(today()),planMode:'grid',planDept:'',resFilter:'kommend',resQ:'',showPastAbs:false,showPastSpecial:false,
  rep:{type:'plan',period:'nextweek',from:'',to:'',dept:'',staff:'',layout:'grid',gruende:false,kontakt:false}};
const undoStack=[];

function defaults(){
  const T=(name,kurz,abt,von,bis,pause)=>({id:uid(),name,kurz,abt,von,bis,pause});
  const open=(zu,slots,kueche)=>({zu,slots,kueche});
  return {
    app:APP_ID,version:VERSION,
    betrieb:{name:'Gasthof Ratz',adresse:'',telefon:'',email:'',region:'DE-BW',feiertagRegel:'sonntag',ruhezeit:11,maxTag:10},
    abteilungen:[{id:'service',name:'Service',farbe:'#2f6f9f',pflicht:true},{id:'kueche',name:'Küche',farbe:'#c0632b',pflicht:true},{id:'bar',name:'Schank/Bar',farbe:'#7a4fa0',pflicht:false},{id:'spuele',name:'Spüle/Reinigung',farbe:'#5f7f3a',pflicht:false}],
    raeume:[{name:'Gaststube',plaetze:60},{name:'Nebenzimmer',plaetze:30},{name:'Saal',plaetze:90},{name:'Biergarten',plaetze:120}],
    templates:[
      T('Service Mittag','SM','service','10:30','15:00',30),
      T('Service Abend','SA','service','17:00','23:00',30),
      T('Service Durchgehend','SD','service','11:00','20:30',45),
      T('Küche Mittag','KM','kueche','09:30','14:30',30),
      T('Küche Abend','KA','kueche','16:30','22:00',30),
      T('Schank Abend','BA','bar','17:00','00:00',30),
      T('Spüle Abend','SpA','spuele','18:00','23:00',0)
    ],
    hours:{weekly:[
      open(true,[],''),
      open(false,[{von:'11:30',bis:'14:00'},{von:'17:30',bis:'22:00'}],'21:00'),
      open(false,[{von:'11:30',bis:'14:00'},{von:'17:30',bis:'22:00'}],'21:00'),
      open(false,[{von:'11:30',bis:'14:00'},{von:'17:30',bis:'22:00'}],'21:00'),
      open(false,[{von:'11:30',bis:'14:00'},{von:'17:30',bis:'23:00'}],'21:30'),
      open(false,[{von:'11:30',bis:'23:00'}],'21:30'),
      open(false,[{von:'11:30',bis:'21:00'}],'20:00')
    ],special:[]},
    staff:[],absences:[],shifts:[],reservations:[],
    meta:{created:Date.now(),lastChange:0,lastBackup:0}
  };
}

function migrate(d){
  const def=defaults();
  const o=Object.assign({},def,d);
  o.betrieb=Object.assign({},def.betrieb,d.betrieb||{});
  o.meta=Object.assign({},def.meta,d.meta||{});
  for(const k of ['staff','absences','shifts','reservations','templates','abteilungen','raeume']) if(!Array.isArray(o[k])) o[k]=def[k];
  o.hours=(d.hours&&Array.isArray(d.hours.weekly)&&d.hours.weekly.length===7)?{weekly:d.hours.weekly.map(w=>({zu:!!w.zu,slots:Array.isArray(w.slots)?w.slots:[],kueche:w.kueche||''})),special:Array.isArray(d.hours.special)?d.hours.special:[]}:def.hours;
  o.abteilungen.forEach(a=>{if(a.pflicht===undefined)a.pflicht=(a.id==='service'||a.id==='kueche');});
  o.staff.forEach(s=>{if(!Array.isArray(s.nichtAn))s.nichtAn=[]; if(s.aktiv===undefined)s.aktiv=true;});
  o.app=APP_ID;o.version=VERSION;
  return o;
}

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return migrate(JSON.parse(raw));}
  catch(e){storageOK=false;console.error(e);}
  return null;
}
function writeData(){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true;}
  catch(e){
    // Speicher voll? Älteste automatische Sicherungen opfern und erneut versuchen.
    let sn=getSnaps();
    while(sn.length>1){sn.pop();try{localStorage.setItem(SNAP_KEY,JSON.stringify(sn));localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(_){}}
    toast('Speichern fehlgeschlagen: '+e.message+' – bitte sofort ein Backup herunterladen!',{err:true});return false;
  }
}
function save(){S.meta.lastChange=Date.now();writeData();updateHead();}
function saveQuiet(){writeData();updateHead();}
function commit(label,fn,opts={}){
  const before=JSON.stringify(S);
  const res=fn();
  if(res===false) return false;
  undoStack.push(before); if(undoStack.length>25) undoStack.shift();
  save(); render();
  if(label) toast(label,{undo:opts.undo!==false});
  return true;
}
function undo(){
  const prev=undoStack.pop(); if(!prev){toast('Nichts zum Rückgängigmachen');return;}
  S=migrate(JSON.parse(prev)); save(); closeModal(); render(); toast('Rückgängig gemacht');
}
function saveUI(){try{localStorage.setItem(UI_KEY,JSON.stringify({tab:UI.tab,planMode:UI.planMode,planDept:UI.planDept,rep:UI.rep}));}catch(e){}}
function loadUI(){try{const u=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(u){UI.tab=u.tab||UI.tab;UI.planMode=u.planMode||UI.planMode;UI.planDept=u.planDept||'';if(u.rep)Object.assign(UI.rep,u.rep);}}catch(e){}}

/* Automatische Sicherungen (auf dem Gerät) */
function getSnaps(){try{return JSON.parse(localStorage.getItem(SNAP_KEY)||'[]')||[];}catch(e){return [];}}
function addSnap(reason){
  if(!S) return;
  let sn=getSnaps();
  sn.unshift({ts:Date.now(),reason,data:JSON.parse(JSON.stringify(S))});
  sn=sn.slice(0,MAX_SNAPS);
  while(sn.length){try{localStorage.setItem(SNAP_KEY,JSON.stringify(sn));return;}catch(e){sn.pop();}}
}
function dailySnap(){
  if(!S||(!S.staff.length&&!S.shifts.length&&!S.reservations.length)) return;
  const sn=getSnaps();
  if(!sn.length||iso(new Date(sn[0].ts))!==today()) addSnap('Automatisch (Tagesbeginn)');
}

/* ---------- Lookups ---------- */
const staffById=id=>S.staff.find(s=>s.id===id);
const dept=id=>S.abteilungen.find(a=>a.id===id)||{id:id||'',name:'Sonstige',farbe:'#8a8f8b'};
const tplById=id=>S.templates.find(t=>t.id===id);
function staffSorted(includeInactive){
  const order=S.abteilungen.map(a=>a.id);
  const oi=id=>{const i=order.indexOf(id);return i<0?99:i;};
  return S.staff.filter(s=>includeInactive||s.aktiv!==false).sort((a,b)=>(oi(a.abt)-oi(b.abt))||a.name.localeCompare(b.name,'de'));
}
function indexShifts(from,to){
  const m={};
  for(const x of S.shifts){ if(x.datum<from||x.datum>to) continue; (m[x.staff+'|'+x.datum]=m[x.staff+'|'+x.datum]||[]).push(x); }
  Object.values(m).forEach(a=>a.sort(byTime));
  return m;
}
const absenceOn=(sid,d)=>S.absences.find(a=>a.staff===sid&&d>=a.von&&d<=(a.bis||a.von));
function resOn(d,inclStorno){return S.reservations.filter(r=>r.datum===d&&(inclStorno||r.status!=='storniert')).sort(byTime);}
function resSums(from,to){
  const m={};
  for(const r of S.reservations){ if(r.datum<from||r.datum>to||r.status==='storniert') continue; const o=m[r.datum]=m[r.datum]||{n:0,p:0}; o.n++; o.p+=(+r.personen||0); }
  return m;
}

/* ---------- Feiertage ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da));}
const HOL={};
function holidaysOf(y){
  const r=(S&&S.betrieb.region)||'none', k=r+y;
  if(HOL[k]) return HOL[k];
  const m={}; const f=(mm,dd)=>`${y}-${pad(mm)}-${pad(dd)}`;
  const add=(d,n,frei=true)=>{m[d]={n,frei};};
  if(r!=='none'){
    const e=easter(y), AT=r==='AT';
    add(f(1,1),'Neujahr'); add(e,'Ostersonntag',false); add(addD(e,1),'Ostermontag');
    add(f(5,1),AT?'Staatsfeiertag':'Tag der Arbeit'); add(addD(e,39),'Christi Himmelfahrt');
    add(addD(e,49),'Pfingstsonntag',false); add(addD(e,50),'Pfingstmontag');
    add(f(12,24),'Heiligabend',false); add(f(12,25),AT?'Christtag':'1. Weihnachtstag'); add(f(12,26),AT?'Stefanitag':'2. Weihnachtstag'); add(f(12,31),'Silvester',false);
    if(r.startsWith('DE')){ add(addD(e,-2),'Karfreitag'); add(f(10,3),'Tag der Deutschen Einheit'); }
    if(r==='DE-BW'||r==='DE-BY'||AT){ add(f(1,6),'Heilige Drei Könige'); add(addD(e,60),'Fronleichnam'); add(f(11,1),'Allerheiligen'); }
    if(r==='DE-BY'||AT) add(f(8,15),'Mariä Himmelfahrt');
    if(AT){ add(f(10,26),'Nationalfeiertag'); add(f(12,8),'Mariä Empfängnis'); }
  }
  return HOL[k]=m;
}
const holidayObj=d=>holidaysOf(+d.slice(0,4))[d]||null;
const holiday=d=>(holidayObj(d)||{}).n||'';

/* ---------- Öffnungszeiten ---------- */
function openInfo(d){
  const sp=S.hours.special.find(x=>d>=x.von&&d<=(x.bis||x.von));
  const ho=holidayObj(d);
  if(sp){ const zu=sp.typ==='zu'; return {closed:zu,slots:zu?[]:(sp.slots||[]).filter(s=>s.von&&s.bis),kueche:zu?'':(sp.kueche||''),note:sp.name||(zu?'Geschlossen':'Sonderöffnung'),special:true}; }
  let w=S.hours.weekly[wd(d)], note='';
  if(ho&&ho.frei){
    const rule=S.betrieb.feiertagRegel;
    if(rule==='zu') return {closed:true,slots:[],kueche:'',note:ho.n+' – geschlossen'};
    if(rule==='sonntag'){ w=S.hours.weekly[6]; note='Feiertag: Sonntagszeiten'; }
  }
  return {closed:!!w.zu,slots:w.zu?[]:(w.slots||[]).filter(s=>s.von&&s.bis),kueche:w.zu?'':(w.kueche||''),note:w.zu?'Ruhetag':note};
}
const slotsTxt=o=>o.closed?(o.note||'geschlossen'):((o.slots.map(s=>`${s.von}–${s.bis}`).join(' · '))||'geöffnet');
function timeInOpen(o,t){
  if(o.closed) return false; if(!o.slots.length) return true;
  const m=tmin(t);
  return o.slots.some(s=>{const a=tmin(s.von);let b=tmin(s.bis);if(b<=a)b+=1440;return (m>=a&&m<b)||(m+1440>=a&&m+1440<b);});
}

/* ---------- Prüfungen / Hinweise ---------- */
function computeWarnings(from,to){
  const W=[]; const pre=addD(from,-1);
  const rz=(+S.betrieb.ruhezeit||11)*60, mx=(+S.betrieb.maxTag||10)*60;
  const by={};
  S.shifts.forEach(x=>{if(x.datum>=pre&&x.datum<=to)(by[x.staff]=by[x.staff]||[]).push(x);});
  for(const [sid,arr] of Object.entries(by)){
    const s=staffById(sid); if(!s) continue;
    arr.sort((a,b)=>absStart(a)-absStart(b));
    const dm={};
    arr.forEach((x,i)=>{
      const inR=x.datum>=from;
      if(inR){
        dm[x.datum]=(dm[x.datum]||0)+shiftMin(x);
        const ab=absenceOn(sid,x.datum); if(ab) W.push({d:x.datum,s:sid,lv:'err',t:`${ab.typ} eingetragen, aber eingeteilt`});
        const o=openInfo(x.datum); if(o.closed) W.push({d:x.datum,s:sid,lv:'info',t:`Schicht an geschlossenem Tag (${o.note||'geschlossen'})`});
        if((s.nichtAn||[]).includes(wd(x.datum))) W.push({d:x.datum,s:sid,lv:'warn',t:`ist ${WDL[wd(x.datum)]}s normalerweise nicht verfügbar`});
      }
      if(i>0&&inR){
        const p=arr[i-1], gap=absStart(x)-absEnd(p);
        if(gap<0) W.push({d:x.datum,s:sid,lv:'err',t:`Schichten überschneiden sich (${p.von}–${p.bis} und ${x.von}–${x.bis})`});
        else if(p.datum!==x.datum&&gap<rz) W.push({d:x.datum,s:sid,lv:'warn',t:`Ruhezeit nur ${fmtH(gap)} h (Vorgabe ${S.betrieb.ruhezeit} h)`});
      }
    });
    for(const [d,m] of Object.entries(dm)) if(m>mx) W.push({d,s:sid,lv:'warn',t:`${fmtH(m)} h an einem Tag (max. ${S.betrieb.maxTag} h)`});
  }
  const staffed=new Set(S.staff.filter(s=>s.aktiv!==false).map(s=>s.abt));
  days(from,to).forEach(d=>{
    if(openInfo(d).closed) return;
    S.abteilungen.forEach(a=>{
      if(!a.pflicht||!staffed.has(a.id)) return;
      const any=S.shifts.some(x=>x.datum===d&&x.abt===a.id);
      if(!any) W.push({d,s:null,lv:'warn',t:`Niemand eingeteilt: ${a.name}`});
    });
  });
  const rank={err:0,warn:1,info:2};
  return W.sort((a,b)=>a.d.localeCompare(b.d)||rank[a.lv]-rank[b.lv]);
}

/* ---------- Icons ---------- */
const ICON={
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

  res:'<svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3.2 2.2-3.2 5.5S15 13 17 13v8M17 3v10"/></svg>',
  people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6c1.8.7 3 2.4 3.5 5"/></svg>',

};
const TABS=[['start','Start',ICON.home],['plan','Dienstplan',ICON.cal],['res','Gäste',ICON.res],['staff','Personal',ICON.people],['reports','Reports',ICON.doc],['setup','Betrieb',ICON.set]];

/* ---------- UI-Infrastruktur ---------- */
let toastTimer;
function toast(msg,o={}){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${o.undo&&undoStack.length?'<button data-a="undo">Rückgängig</button>':''}`;
  t.className='show'+(o.err?' err':'');

    const root=$('#ask-root');

function download(name,content,type){
  const blob=content instanceof Blob?content:new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('In die Zwischenablage kopiert');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){} ta.remove();
  toast(ok?'In die Zwischenablage kopiert':'Kopieren nicht möglich – bitte Text manuell markieren',{err:!ok});
}
async function shareText(title,text){
  if(navigator.share){ try{await navigator.share({title,text});return;}catch(e){if(e&&e.name==='AbortError')return;} }
  copyText(text);
}
function phoneIntl(p){
  let d=String(p||'').replace(/[^\d+]/g,'');
  if(!d) return '';
  if(d.startsWith('+')) return d.slice(1);
  if(d.startsWith('00')) return d.slice(2);
  const cc=S.betrieb.region==='AT'?'43':'49';
  if(d.startsWith('0')) return cc+d.slice(1);
  return d;
}

function updDur(){
  const f=$('#f-shift'); if(!f) return; const el=$('#durinfo');

  let t=`Arbeitszeit: ${fmtH(net)} h netto${tmin(bis)<=tmin(von)?' · endet am Folgetag':''}`;

  else if(raw>6*60&&p<30) t+=' · Hinweis: über 6 h sind 30 Min. Pause üblich (ArbZG)';

/* ---------- Backup / Import ---------- */
function backupName(prefix='Backup'){const d=new Date();return `GasthofRatz_${prefix}_${iso(d)}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;}
function backupJSON(data=S){return JSON.stringify({app:APP_ID,version:VERSION,exported:new Date().toISOString(),betrieb:data.betrieb&&data.betrieb.name,data},null,1);}
function markBackup(){S.meta.lastBackup=Date.now();saveQuiet();render();}
function backupDownload(){download(backupName(),backupJSON(),'application/json');markBackup();toast('Backup-Datei wird gespeichert (Ordner „Downloads“)');}
async function backupShare(){
  const json=backupJSON(), name=backupName();
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup '+S.betrieb.name,text:'Backup vom '+fmtTS(Date.now())});markBackup();toast('Backup geteilt');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  backupDownload(); toast('Teilen wird hier nicht unterstützt – Datei wurde heruntergeladen');
}
function extractBackup(obj){
  const d=(obj&&obj.app===APP_ID&&obj.data)?obj.data:obj;
  if(!d||typeof d!=='object'||!Array.isArray(d.staff)||!Array.isArray(d.shifts)) throw new Error('Das ist kein Backup dieses Planers.');
  return migrate(d);
}
function confirmImport(data,exported,source){
  const body=`<p>${source}${exported?` vom <b>${esc(fmtTS(exported))}</b>`:''}</p>
  <div class="notice">${data.staff.length} Mitarbeiter · ${data.shifts.length} Schichten · ${data.absences.length} Abwesenheiten · ${data.reservations.length} Reservierungen · ${data.templates.length} Vorlagen</div>
  ${S?`<div class="notice warn">Die aktuellen Daten auf diesem Gerät (${S.staff.length} Mitarbeiter, ${S.shifts.length} Schichten, ${S.reservations.length} Reservierungen) werden <b>ersetzt</b>. Vorher wird automatisch eine Sicherung angelegt.</div>`:''}`;
  window.__pendingImport=data;
  modal('Backup einspielen',body,`<button type="button" class="btn" data-a="mclose">Abbrechen</button><button type="button" class="btn primary" data-a="import-do">Einspielen</button>`,'small');
}
function doImport(){
  const data=window.__pendingImport; if(!data) return;
  if(S) addSnap('Vor dem Einspielen eines Backups');
  undoStack.push(S?JSON.stringify(S):JSON.stringify(defaults()));
  S=data; S.meta.lastBackup=Date.now(); S.meta.lastChange=Date.now()-1; window.__pendingImport=null;
  writeData(); closeModal(); UI.tab='start'; render(); toast('Backup eingespielt',{undo:true});
}
function readImportFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);confirmImport(extractBackup(obj),obj.exported,'Backup-Datei „'+esc(file.name)+'“');}catch(e){toast('Datei konnte nicht gelesen werden: '+e.message,{err:true});}};
  r.onerror=()=>toast('Datei konnte nicht gelesen werden',{err:true});
  r.readAsText(file);
}

/* ---------- Reports ---------- */
function periodRange(p){
  const t=today(), m=monday(t), d=P(t);
  switch(p){
    case 'thisweek': return [m,addD(m,6)];
    case 'nextweek': return [addD(m,7),addD(m,13)];
    case 'next14': return [t,addD(t,13)];
    case 'thismonth': return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))];
    case 'nextmonth': return [iso(new Date(d.getFullYear(),d.getMonth()+1,1)),iso(new Date(d.getFullYear(),d.getMonth()+2,0))];
    default: { let a=UI.rep.from||t, b=UI.rep.to||addD(t,6); if(b<a) [a,b]=[b,a]; if(dayDiff(a,b)>370) b=addD(a,370); return [a,b]; }
  }
}
const PERIODS=[['thisweek','Diese Woche'],['nextweek','Nächste Woche'],['next14','Nächste 14 Tage'],['thismonth','Dieser Monat'],['nextmonth','Nächster Monat'],['custom','Eigener Zeitraum']];
const REPTYPES=[['plan','Dienstplan (Team)'],['person','Dienstplan einer Person'],['res','Reservierungen'],['hours','Stundenübersicht'],['open','Öffnungszeiten']];
function staffForPeriod(from,to,dp){
  return staffSorted(true).filter(s=>(!dp||s.abt===dp)&&(s.aktiv!==false||S.shifts.some(x=>x.staff===s.id&&x.datum>=from&&x.datum<=to)));
}
function chunkWeeks(ds){const w=[];let cur=[];ds.forEach(d=>{if(cur.length&&wd(d)===0){w.push(cur);cur=[];}cur.push(d);});if(cur.length)w.push(cur);return w;}
const absLabel=(ab,gr)=>!ab?'':(gr||ab.typ==='Urlaub'||ab.typ==='Berufsschule')?ab.typ:'frei';
function csvOut(rows){return '\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');}

function buildReport(){
  const r=UI.rep; const [from,to]=periodRange(r.period);
  const fn={plan:repPlan,person:repPerson,res:repRes,hours:repHours,open:repOpen}[r.type]||repPlan;
  const rep=fn(from,to,r); rep.from=from; rep.to=to; return rep;
}
function repPlan(from,to,r){
  const ds=days(from,to), staff=staffForPeriod(from,to,r.dept), idx=indexShifts(from,to), weeks=chunkWeeks(ds);
  const depts=r.dept?[dept(r.dept)]:S.abteilungen;
  let html='';

function repHours(from,to,r){
  const ds=days(from,to), n=ds.length, staff=staffForPeriod(from,to,r.dept);
  let tIst=0,tSoll=0;
  const rows=[['Mitarbeiter','Abteilung','Beschäftigung','Schichten','Ist-Stunden','Soll-Stunden (anteilig)','Differenz','Urlaubstage','Krankheitstage']];
  const body=staff.map(s=>{
    const sh=S.shifts.filter(x=>x.staff===s.id&&x.datum>=from&&x.datum<=to);
    const ist=sh.reduce((a,x)=>a+shiftMin(x),0), soll=Math.round((+s.soll||0)*60*n/7);
    const ur=ds.filter(d=>{const a=absenceOn(s.id,d);return a&&a.typ==='Urlaub';}).length;
    const kr=ds.filter(d=>{const a=absenceOn(s.id,d);return a&&a.typ==='Krank';}).length;
    tIst+=ist;tSoll+=soll;
    rows.push([s.name,dept(s.abt).name,s.vertrag||'',sh.length,fmtH(ist),fmtH(soll),fmtH(ist-soll),ur,kr]);
    const diff=ist-soll;
    return `<tr><th>${esc(s.name)}<small>${esc(dept(s.abt).name)} · ${esc(s.vertrag||'')}</small></th><td class="r">${sh.length}</td><td class="r">${fmtH(ist)}</td><td class="r">${soll?fmtH(soll):'–'}</td><td class="r ${diff>0?'plus':diff<0?'minus':''}">${soll?(diff>0?'+':'')+fmtH(diff):'–'}</td><td class="r">${ur||''}</td><td class="r">${kr||''}</td></tr>`;
  }).join('');

  const text=`*Stundenübersicht ${S.betrieb.name}*\n${rangeTxt(from,to)}\n\n`+rows.slice(1).map(x=>`${x[0]}: ${x[4]} h (Soll ${x[5]} h, Diff. ${x[6]})`).join('\n');
  return {title:'Stundenübersicht'+(r.dept?' '+dept(r.dept).name:''),sub:rangeTxt(from,to),html,text,csv:csvOut(rows),csvName:`Stunden_${from}_bis_${to}.csv`};
}

/* ---------- Formulare ---------- */
function fd(f){return Object.fromEntries(new FormData(f).entries());}
function applyAbtForm(withToast){
  const f=$('#f-abt'); if(!f) return; const v=fd(f);
  S.abteilungen.forEach(a=>{if(v['an_'+a.id]!==undefined){a.name=v['an_'+a.id].trim()||a.name;a.farbe=col(v['ac_'+a.id]);a.pflicht=!!v['ap_'+a.id];}});
  S.raeume.forEach((r,i)=>{if(v['rn_'+i]!==undefined){r.name=v['rn_'+i].trim()||r.name;r.plaetze=+v['rp_'+i]||0;}});
  if(withToast){save();render();toast('Gespeichert');}
}
const FORMS={
  shift:f=>{
    const v=fd(f); if(!v.staff){toast('Bitte Mitarbeiter wählen',{err:true});return;}
    const data={staff:v.staff,datum:v.datum,von:v.von,bis:v.bis,pause:Math.max(0,+v.pause||0),abt:v.abt,tpl:v.tpl||'',notiz:(v.notiz||'').trim()};
    commit(v.id?'Schicht geändert':'Schicht eingetragen',()=>{if(v.id){Object.assign(S.shifts.find(x=>x.id===v.id),data);}else S.shifts.push({id:uid(),...data});});
    closeModal();
  },
  staff:f=>{
    const v=fd(f);
    const data={name:v.name.trim(),abt:v.abt,rolle:(v.rolle||'').trim(),vertrag:v.vertrag,soll:+v.soll||0,tel:(v.tel||'').trim(),email:(v.email||'').trim(),aktiv:!!v.aktiv,nichtAn:WD.map((_,i)=>v['na'+i]?i:-1).filter(i=>i>=0),notiz:(v.notiz||'').trim()};
    if(!data.name) return;
    commit(v.id?'Mitarbeiter gespeichert':'Mitarbeiter angelegt',()=>{if(v.id)Object.assign(staffById(v.id),data);else S.staff.push({id:uid(),kurz:'',...data});});
    closeModal();
  },
  abs:f=>{
    const v=fd(f); if(!v.staff){toast('Bitte Mitarbeiter wählen',{err:true});return;}
    let von=v.von,bis=v.bis||v.von; if(bis<von)[von,bis]=[bis,von];
    const data={staff:v.staff,typ:v.typ,von,bis,notiz:(v.notiz||'').trim()};
    const del=!!v.delShifts; let n=0;
    commit(v.id?'Abwesenheit gespeichert':'Abwesenheit eingetragen',()=>{
      if(v.id)Object.assign(S.absences.find(a=>a.id===v.id),data);else S.absences.push({id:uid(),...data});
      if(del){const before=S.shifts.length;S.shifts=S.shifts.filter(x=>!(x.staff===data.staff&&x.datum>=von&&x.datum<=bis));n=before-S.shifts.length;}
    });
    if(n) toast(`Abwesenheit eingetragen, ${n} Schichten entfernt`,{undo:true});
    closeModal();
  },
  res:f=>{
    const v=fd(f);
    const data={datum:v.datum,zeit:v.zeit,name:v.name.trim(),personen:+v.personen||1,tel:(v.tel||'').trim(),email:(v.email||'').trim(),bereich:v.bereich,tisch:(v.tisch||'').trim(),anlass:(v.anlass||'').trim(),status:v.status,notiz:(v.notiz||'').trim()};
    commit(v.id?'Reservierung gespeichert':'Reservierung eingetragen',()=>{if(v.id)Object.assign(S.reservations.find(r=>r.id===v.id),data);else S.reservations.push({id:uid(),erstellt:Date.now(),...data});});
    closeModal();
  },
  tpl:f=>{
    const v=fd(f); const data={name:v.name.trim(),kurz:(v.kurz||'').trim(),abt:v.abt,von:v.von,bis:v.bis,pause:+v.pause||0};
    commit('Vorlage gespeichert',()=>{if(v.id)Object.assign(tplById(v.id),data);else S.templates.push({id:uid(),...data});});
    closeModal();
  },
  special:f=>{
    const v=fd(f); let von=v.von,bis=v.bis||v.von; if(bis<von)[von,bis]=[bis,von];
    const slots=[{von:v.v1,bis:v.b1},{von:v.v2,bis:v.b2}].filter(s=>s.von&&s.bis);
    if(v.typ==='auf'&&!slots.length){toast('Bitte mindestens ein Zeitfenster angeben',{err:true});return;}
    const data={name:(v.name||'').trim(),von,bis,typ:v.typ,slots:v.typ==='auf'?slots:[],kueche:v.typ==='auf'?(v.k||''):''};
    commit('Sondertag gespeichert',()=>{if(v.id)Object.assign(S.hours.special.find(x=>x.id===v.id),data);else S.hours.special.push({id:uid(),...data});});
    closeModal();
  },
  hours:f=>{
    const v=fd(f);
    commit('Öffnungszeiten gespeichert',()=>{
      S.hours.weekly=WDL.map((_,i)=>({zu:!!v['zu'+i],slots:[{von:v['v1_'+i],bis:v['b1_'+i]},{von:v['v2_'+i],bis:v['b2_'+i]}].filter(s=>s.von&&s.bis),kueche:v['k'+i]||''}));
      S.betrieb.region=v.region; S.betrieb.feiertagRegel=v.feiertagRegel;
    });
  },
  abt:()=>applyAbtForm(true),
  betrieb:f=>{
    const v=fd(f);
    commit('Stammdaten gespeichert',()=>{Object.assign(S.betrieb,{name:v.name.trim()||'Gasthof Ratz',adresse:v.adresse.trim(),telefon:v.telefon.trim(),email:v.email.trim(),ruhezeit:+v.ruhezeit||11,maxTag:+v.maxTag||10});});
  },
  copyweek:f=>{
    const v=fd(f); const src=monday(v.src), off=dayDiff(src,UI.week);
    if(off===0){toast('Quell- und Zielwoche sind gleich',{err:true});return;}
    const to=addD(UI.week,6), dp=UI.planDept;
    const inDept=x=>!dp||(staffById(x.staff)||{}).abt===dp;
    const source=S.shifts.filter(x=>x.datum>=src&&x.datum<=addD(src,6)&&inDept(x));
    if(!source.length){toast('In der Quellwoche sind keine Schichten eingetragen',{err:true});return;}
    let added=0,skipped=0;
    commit(null,()=>{
      if(v.mode==='replace') S.shifts=S.shifts.filter(x=>!(x.datum>=UI.week&&x.datum<=to&&inDept(x)));
      source.forEach(x=>{
        const nd=addD(x.datum,off), s=staffById(x.staff);
        if(!s||s.aktiv===false){skipped++;return;}
        if(v.skipAbs&&(absenceOn(x.staff,nd)||openInfo(nd).closed)){skipped++;return;}
        if(S.shifts.some(z=>z.staff===x.staff&&z.datum===nd&&z.von===x.von&&z.bis===x.bis)){skipped++;return;}
        S.shifts.push({...x,id:uid(),datum:nd}); added++;
      });
    });
    closeModal(); toast(`${added} Schichten übernommen${skipped?`, ${skipped} übersprungen`:''}`,{undo:true});
  }
};

const IN={
  dur:()=>updDur(),
  resq:el=>{clearTimeout(resqTimer);resqTimer=setTimeout(()=>{UI.resQ=el.value;const pos=el.selectionStart;render();const n=$('#resq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},220);}
};

async function requestPersist(silent){
  try{
    if(navigator.storage&&navigator.storage.persist){
      const ok=await navigator.storage.persist();
      if(!silent) toast(ok?'Dauerhafte Speicherung ist aktiv':'Der Browser hat die dauerhafte Speicherung nicht bestätigt. Regelmäßige Backups sind daher besonders wichtig.',{err:!ok});
      updPersistInfo();
    } else if(!silent) toast('Dieser Browser unterstützt die Anfrage nicht – bitte regelmäßig Backups machen.');
  }catch(e){}
}
async function updPersistInfo(){
  const el=$('#persistInfo'); if(!el) return;
  try{ if(navigator.storage&&navigator.storage.persisted){ const p=await navigator.storage.persisted(); el.textContent=p?'Dauerhafter Speicher: aktiv':'Dauerhafter Speicher: nicht garantiert'; } else el.textContent='Dauerhafter Speicher: unbekannt'; }catch(e){el.textContent='';}
}

/* ---------- Init ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]'); if(!a) return;
  if(a.closest('#ask-root')) return;
  const fn=ACT[a.dataset.a]; if(!fn) return;
  if(a.tagName==='A') e.preventDefault();
  fn(a.dataset,a,e);
});
document.addEventListener('submit',e=>{const f=e.target;const fn=FORMS[f.dataset.form];if(fn){e.preventDefault();fn(f);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#ask-root').hidden)return;if(!$('#modal-root').hidden)closeModal();}});
$('#importfile').addEventListener('change',e=>readImportFile(e.target.files[0]));
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();render();}});

$('#rep-style').textContent=REP_CSS;
S=load(); loadUI(); dailySnap();
render();
const mo=new MutationObserver(()=>{if($('#persistInfo')&&!$('#persistInfo').dataset.done){$('#persistInfo').dataset.done='1';updPersistInfo();}});
mo.observe($('#view'),{childList:true});
updPersistInfo();
</script>
</body>
</html>
